<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>두뇌 튼튼 오목 한판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 select-none">

  <!-- 헤더 영역 (슬림하게 압축) -->
  <header class="w-full max-w-md text-center pt-1 px-1">
    <div class="flex items-center justify-between bg-white px-3 py-2 rounded-2xl shadow-sm border border-amber-200">
      <div class="flex items-center gap-1.5">
        <span class="text-base font-black text-gray-900">두뇌 오목 🧠</span>
      </div>
      
      <!-- 난이도 선택 버튼 -->
      <div class="flex gap-1 bg-gray-100 p-0.5 rounded-xl">
        <button id="diff-hard" onclick="setDifficulty('hard')" class="text-xs px-2.5 py-1 rounded-lg font-bold bg-rose-600 text-white shadow-sm transition">어려움 🔥</button>
        <button id="diff-normal" onclick="setDifficulty('normal')" class="text-xs px-2.5 py-1 rounded-lg font-bold text-gray-600 transition">보통</button>
      </div>

      <!-- 턴 표시 -->
      <div class="flex items-center gap-1.5 pl-1">
        <div id="turn-dot" class="w-3.5 h-3.5 rounded-full bg-black shadow"></div>
        <span id="turn-text" class="text-xs font-black text-gray-800">내 차례</span>
      </div>
    </div>
  </header>

  <!-- 바둑판 캔버스 영역 (화면 폭을 꽉 채워 시원시원한 대형 사이즈) -->
  <main class="w-full max-w-md flex items-center justify-center my-auto p-1">
    <div class="bg-[#E4A054] p-1.5 sm:p-2 rounded-2xl shadow-xl border-2 sm:border-4 border-[#8B5A2B] w-full aspect-square flex items-center justify-center">
      <canvas id="omokCanvas" class="w-full h-full cursor-pointer rounded-xl"></canvas>
    </div>
  </main>

  <!-- 하단 조작 버튼 (손쉬운 터치) -->
  <footer class="w-full max-w-md pb-2 px-1 flex gap-2">
    <button onclick="undoMove()" class="flex-1 bg-white hover:bg-gray-50 text-gray-700 font-bold py-3.5 rounded-2xl border border-gray-300 shadow-sm text-sm active:scale-95 transition">
      ↩ 무르기
    </button>
    <button onclick="resetGame()" class="flex-[2] bg-amber-600 hover:bg-amber-700 text-white font-black py-3.5 rounded-2xl shadow-md text-sm active:scale-95 transition">
      🔄 새 판 시작하기
    </button>
  </footer>

  <!-- 승리 모달 -->
  <div id="winModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl border-4 border-amber-400">
      <div id="winEmoji" class="text-5xl mb-2">🏆</div>
      <h2 id="winTitle" class="text-2xl font-black text-gray-800 mb-1">흑돌 승리!</h2>
      <p id="winDesc" class="text-gray-600 text-sm font-bold mb-5">축하드립니다! 다섯 알을 멋지게 이으셨어요!</p>
      <button onclick="resetGame()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-black text-base py-3 rounded-xl shadow-md transition active:scale-95">
        다시 한판 하기 🎯
      </button>
    </div>
  </div>

  <script>
    // --- 효과음 시스템 ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playStoneSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.8, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.09);
      } catch(e) {}
    }

    function playUndoSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.13);
      } catch(e) {}
    }

    function playWinSound() {
      try {
        const ctx = getAudioContext();
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = ctx.currentTime + (idx * 0.12);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.4, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.01, start + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.25);
        });
      } catch(e) {}
    }

    // --- 게임 & AI 엔진 ---
    const canvas = document.getElementById('omokCanvas');
    const ctx = canvas.getContext('2d');
    const SIZE = 11;
    let board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    let currentPlayer = 1; // 1: 흑(플레이어), 2: 백(컴퓨터)
    let history = [];
    let isGameOver = false;
    let difficulty = 'hard';

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      drawBoard();
    }

    // 바둑판 안쪽 여백을 0.65배로 타이트하게 잡아 판 크기를 최대화
    function getCellSize() {
      const rect = canvas.getBoundingClientRect();
      return rect.width / (SIZE + 0.3);
    }

    function getOffset() {
      const cellSize = getCellSize();
      return cellSize * 0.65;
    }

    function drawBoard() {
      const rect = canvas.getBoundingClientRect();
      const cellSize = getCellSize();
      const offset = getOffset();
      ctx.clearRect(0, 0, rect.width, rect.height);

      // 격자선 (더 선명하고 진하게)
      ctx.strokeStyle = '#4A2A10';
      ctx.lineWidth = 1.8;

      for (let i = 0; i < SIZE; i++) {
        const pos = offset + cellSize * i;
        // 가로선
        ctx.beginPath();
        ctx.moveTo(offset, pos);
        ctx.lineTo(offset + cellSize * (SIZE - 1), pos);
        ctx.stroke();

        // 세로선
        ctx.beginPath();
        ctx.moveTo(pos, offset);
        ctx.lineTo(pos, offset + cellSize * (SIZE - 1));
        ctx.stroke();
      }

      // 화점 표시 (중앙 1개 및 모서리 포인트)
      const centerPos = offset + cellSize * 5;
      ctx.fillStyle = '#4A2A10';
      ctx.beginPath();
      ctx.arc(centerPos, centerPos, 5, 0, Math.PI * 2);
      ctx.fill();

      // 돌 그리기
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] !== 0) {
            drawStone(r, c, board[r][c]);
          }
        }
      }

      // 마지막 착수 빨간 점 표시
      if (history.length > 0) {
        const last = history[history.length - 1];
        const x = offset + cellSize * last.c;
        const y = offset + cellSize * last.r;
        ctx.fillStyle = '#EF4444';
        ctx.beginPath();
        ctx.arc(x, y, cellSize * 0.16, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawStone(r, c, player) {
      const cellSize = getCellSize();
      const offset = getOffset();
      const x = offset + cellSize * c;
      const y = offset + cellSize * r;
      const radius = cellSize * 0.44; // 알 크기를 시원하게 큼직하게 조정

      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 5;
      ctx.shadowOffsetX = 2.5;
      ctx.shadowOffsetY = 2.5;

      const grad = ctx.createRadialGradient(x - radius/3, y - radius/3, radius/10, x, y, radius);
      if (player === 1) {
        grad.addColorStop(0, '#666');
        grad.addColorStop(1, '#111');
      } else {
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(1, '#d4d4d4');
      }
      ctx.fillStyle = grad;
      ctx.fill();

      if (player === 2) {
        ctx.strokeStyle = '#b0b0b0';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
      ctx.restore();
    }

    canvas.addEventListener('click', (e) => {
      if (isGameOver || currentPlayer === 2) return;

      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const cellSize = getCellSize();
      const offset = getOffset();

      const col = Math.round((x - offset) / cellSize);
      const row = Math.round((y - offset) / cellSize);

      if (row >= 0 && row < SIZE && col >= 0 && col < SIZE && board[row][col] === 0) {
        placeMove(row, col, 1);
      }
    });

    function placeMove(r, c, player) {
      board[r][c] = player;
      history.push({ r, c, player });
      drawBoard();
      playStoneSound();

      if (checkWin(r, c, player)) {
        endGame(player);
        return;
      }

      currentPlayer = (player === 1) ? 2 : 1;
      updateUI();

      if (currentPlayer === 2 && !isGameOver) {
        setTimeout(aiTurn, 250);
      }
    }

    // --- AI 계산 알고리즘 ---
    function evaluateLine(r, c, dr, dc, p) {
      let count = 1;
      let openEnds = 0;

      let step = 1;
      while (true) {
        let nr = r + dr * step, nc = c + dc * step;
        if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) break;
        if (board[nr][nc] === p) count++;
        else if (board[nr][nc] === 0) { openEnds++; break; }
        else break;
        step++;
      }

      step = 1;
      while (true) {
        let nr = r - dr * step, nc = c - dc * step;
        if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) break;
        if (board[nr][nc] === p) count++;
        else if (board[nr][nc] === 0) { openEnds++; break; }
        else break;
        step++;
      }

      if (count >= 5) return 100000;
      if (count === 4) {
        if (openEnds === 2) return 10000;
        if (openEnds === 1) return 1500;
      }
      if (count === 3) {
        if (openEnds === 2) return 2000;
        if (openEnds === 1) return 200;
      }
      if (count === 2) {
        if (openEnds === 2) return 100;
        if (openEnds === 1) return 20;
      }
      return 1;
    }

    function evaluatePosition(r, c, p) {
      const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
      let score = 0;
      for (let [dr, dc] of dirs) {
        score += evaluateLine(r, c, dr, dc, p);
      }
      return score;
    }

    function aiTurn() {
      let bestMove = null;
      let maxScore = -Infinity;

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) {
            board[r][c] = 2;
            if (checkWin(r, c, 2)) {
              board[r][c] = 0;
              placeMove(r, c, 2);
              return;
            }
            board[r][c] = 0;
          }
        }
      }

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) {
            board[r][c] = 1;
            if (checkWin(r, c, 1)) {
              board[r][c] = 0;
              placeMove(r, c, 2);
              return;
            }
            board[r][c] = 0;
          }
        }
      }

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) {
            let attackScore = evaluatePosition(r, c, 2);
            let defenseScore = evaluatePosition(r, c, 1);
            let centerBonus = (5 - Math.abs(r - 5)) + (5 - Math.abs(c - 5));

            let totalScore = 0;
            if (difficulty === 'hard') {
              totalScore = (attackScore * 1.2) + (defenseScore * 1.5) + centerBonus;
            } else {
              totalScore = attackScore + defenseScore + (Math.random() * 80);
            }

            if (totalScore > maxScore) {
              maxScore = totalScore;
              bestMove = { r, c };
            }
          }
        }
      }

      if (bestMove) {
        placeMove(bestMove.r, bestMove.c, 2);
      }
    }

    function checkWin(r, c, p) {
      const dirs = [[1,0], [0,1], [1,1], [1,-1]];
      for (let [dr, dc] of dirs) {
        let count = 1;
        for (let step = 1; step <= 4; step++) {
          let nr = r + dr * step, nc = c + dc * step;
          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === p) count++;
          else break;
        }
        for (let step = 1; step <= 4; step++) {
          let nr = r - dr * step, nc = c - dc * step;
          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === p) count++;
          else break;
        }
        if (count >= 5) return true;
      }
      return false;
    }

    function updateUI() {
      const dot = document.getElementById('turn-dot');
      const text = document.getElementById('turn-text');
      if (currentPlayer === 1) {
        dot.className = 'w-3.5 h-3.5 rounded-full bg-black shadow';
        text.textContent = '내 차례';
      } else {
        dot.className = 'w-3.5 h-3.5 rounded-full bg-white border border-gray-400 shadow';
        text.textContent = '생각 중...';
      }
    }

    function endGame(winner) {
      isGameOver = true;
      playWinSound();
      const modal = document.getElementById('winModal');
      const title = document.getElementById('winTitle');
      const desc = document.getElementById('winDesc');
      const emoji = document.getElementById('winEmoji');

      if (winner === 1) {
        emoji.textContent = "🏆";
        title.textContent = "흑돌 승리! 🎉";
        desc.textContent = "고수 인공지능을 멋지게 꺾으셨습니다! 대단하세요!";
      } else {
        emoji.textContent = "🤖";
        title.textContent = "컴퓨터 승리! 👏";
        desc.textContent = "컴퓨터가 한 수 앞섰네요. 다시 도전해보세요!";
      }
      modal.classList.remove('hidden');
    }

    function undoMove() {
      if (history.length === 0 || isGameOver) return;
      playUndoSound();
      const steps = history.length >= 2 ? 2 : 1;
      for (let i = 0; i < steps; i++) {
        const last = history.pop();
        if (last) board[last.r][last.c] = 0;
      }
      currentPlayer = 1;
      updateUI();
      drawBoard();
    }

    function resetGame() {
      board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      history = [];
      currentPlayer = 1;
      isGameOver = false;
      document.getElementById('winModal').classList.add('hidden');
      updateUI();
      drawBoard();
    }

    function setDifficulty(diff) {
      difficulty = diff;
      document.getElementById('diff-hard').className = diff === 'hard' ? 'text-xs px-2.5 py-1 rounded-lg font-bold bg-rose-600 text-white shadow-sm transition' : 'text-xs px-2.5 py-1 rounded-lg font-bold text-gray-600 transition';
      document.getElementById('diff-normal').className = diff === 'normal' ? 'text-xs px-2.5 py-1 rounded-lg font-bold bg-amber-600 text-white shadow-sm transition' : 'text-xs px-2.5 py-1 rounded-lg font-bold text-gray-600 transition';
      resetGame();
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', resizeCanvas);
    setTimeout(resizeCanvas, 100);
  </script>
</body>
</html>
