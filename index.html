<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>두뇌 튼튼 오목 한판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center justify-between p-4 select-none">

  <!-- 헤더 영역 -->
  <header class="w-full max-w-sm text-center pt-2">
    <div class="inline-block bg-amber-200 text-amber-900 text-xs font-bold px-3 py-1 rounded-full mb-1">
      🧠 두뇌 활력 오목 게임
    </div>
    <h1 class="text-2xl font-black text-gray-900">두뇌 튼튼 오목 한판</h1>
    
    <!-- 난이도 & 모드 선택 -->
    <div class="mt-3 flex flex-col gap-1.5 bg-white p-2.5 rounded-2xl shadow-sm border border-amber-200">
      <div class="flex items-center justify-between">
        <div class="flex gap-1">
          <button id="diff-hard" onclick="setDifficulty('hard')" class="text-xs px-2.5 py-1 rounded-lg font-bold bg-rose-600 text-white shadow-sm">고수(어려움) 🔥</button>
          <button id="diff-normal" onclick="setDifficulty('normal')" class="text-xs px-2.5 py-1 rounded-lg font-bold bg-gray-100 text-gray-700">보통</button>
        </div>
        <div class="flex items-center gap-1.5">
          <div id="turn-dot" class="w-3.5 h-3.5 rounded-full bg-black shadow"></div>
          <span id="turn-text" class="text-xs font-black text-gray-800">흑돌 차례</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 바둑판 캔버스 영역 -->
  <main class="w-full max-w-sm flex items-center justify-center my-auto">
    <div class="bg-[#E4A054] p-3 rounded-2xl shadow-xl border-4 border-[#8B5A2B] w-full aspect-square flex items-center justify-center">
      <canvas id="omokCanvas" class="w-full h-full cursor-pointer"></canvas>
    </div>
  </main>

  <!-- 하단 조작 버튼 -->
  <footer class="w-full max-w-sm pb-4 flex gap-2">
    <button onclick="undoMove()" class="flex-1 bg-white hover:bg-gray-50 text-gray-700 font-bold py-3 rounded-xl border border-gray-300 shadow-sm text-sm active:scale-95 transition">
      ↩ 무르기
    </button>
    <button onclick="resetGame()" class="flex-[2] bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl shadow-md text-sm active:scale-95 transition">
      🔄 새 판 시작하기
    </button>
  </footer>

  <!-- 승리 모달 -->
  <div id="winModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl border-4 border-amber-400">
      <div id="winEmoji" class="text-5xl mb-2">🏆</div>
      <h2 id="winTitle" class="text-2xl font-black text-gray-800 mb-1">흑돌 승리!</h2>
      <p id="winDesc" class="text-gray-600 text-sm font-bold mb-5">축하드립니다! 다섯 알을 멋지게 이으셨어요!</p>
      <button onclick="resetGame()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-black text-base py-3 rounded-xl shadow-md transition active:scale-95">
        다시 한판 하기 🎯
      </button>
    </div>
  </div>

  <script>
    // --- 효과음 시스템 ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playStoneSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.8, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.09);
      } catch(e) {}
    }

    function playUndoSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.13);
      } catch(e) {}
    }

    function playWinSound() {
      try {
        const ctx = getAudioContext();
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = ctx.currentTime + (idx * 0.12);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.4, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.01, start + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.25);
        });
      } catch(e) {}
    }

    // --- 게임 & AI 엔진 ---
    const canvas = document.getElementById('omokCanvas');
    const ctx = canvas.getContext('2d');
    const SIZE = 11;
    let board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    let currentPlayer = 1; // 1: 흑(플레이어), 2: 백(컴퓨터)
    let history = [];
    let isGameOver = false;
    let difficulty = 'hard'; // 'normal' or 'hard'

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      drawBoard();
    }

    function getCellSize() {
      const rect = canvas.getBoundingClientRect();
      return rect.width / (SIZE + 1);
    }

    function drawBoard() {
      const rect = canvas.getBoundingClientRect();
      const cellSize = getCellSize();
      ctx.clearRect(0, 0, rect.width, rect.height);

      ctx.strokeStyle = '#5C3A1E';
      ctx.lineWidth = 1.5;

      for (let i = 0; i < SIZE; i++) {
        const pos = cellSize * (i + 1);
        ctx.beginPath();
        ctx.moveTo(cellSize, pos);
        ctx.lineTo(cellSize * SIZE, pos);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(pos, cellSize);
        ctx.lineTo(pos, cellSize * SIZE);
        ctx.stroke();
      }

      // 화점 표시
      const centerPos = cellSize * 6;
      ctx.fillStyle = '#5C3A1E';
      ctx.beginPath();
      ctx.arc(centerPos, centerPos, 4, 0, Math.PI * 2);
      ctx.fill();

      // 돌 그리기
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] !== 0) {
            drawStone(r, c, board[r][c]);
          }
        }
      }

      // 마지막 착수 표시
      if (history.length > 0) {
        const last = history[history.length - 1];
        const x = cellSize * (last.c + 1);
        const y = cellSize * (last.r + 1);
        ctx.fillStyle = '#EF4444';
        ctx.beginPath();
        ctx.arc(x, y, cellSize * 0.15, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawStone(r, c, player) {
      const cellSize = getCellSize();
      const x = cellSize * (c + 1);
      const y = cellSize * (r + 1);
      const radius = cellSize * 0.42;

      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;

      const grad = ctx.createRadialGradient(x - radius/3, y - radius/3, radius/10, x, y, radius);
      if (player === 1) {
        grad.addColorStop(0, '#666');
        grad.addColorStop(1, '#111');
      } else {
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(1, '#d8d8d8');
      }
      ctx.fillStyle = grad;
      ctx.fill();

      if (player === 2) {
        ctx.strokeStyle = '#bbb';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.restore();
    }

    canvas.addEventListener('click', (e) => {
      if (isGameOver || currentPlayer === 2) return;

      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const cellSize = getCellSize();

      const col = Math.round(x / cellSize) - 1;
      const row = Math.round(y / cellSize) - 1;

      if (row >= 0 && row < SIZE && col >= 0 && col < SIZE && board[row][col] === 0) {
        placeMove(row, col, 1);
      }
    });

    function placeMove(r, c, player) {
      board[r][c] = player;
      history.push({ r, c, player });
      drawBoard();
      playStoneSound();

      if (checkWin(r, c, player)) {
        endGame(player);
        return;
      }

      currentPlayer = (player === 1) ? 2 : 1;
      updateUI();

      if (currentPlayer === 2 && !isGameOver) {
        setTimeout(aiTurn, 280);
      }
    }

    // --- 고수 AI 계산 알고리즘 ---
    function evaluateLine(r, c, dr, dc, p) {
      let count = 1;
      let openEnds = 0;

      // 정방향 탐색
      let step = 1;
      while (true) {
        let nr = r + dr * step, nc = c + dc * step;
        if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) break;
        if (board[nr][nc] === p) count++;
        else if (board[nr][nc] === 0) { openEnds++; break; }
        else break;
        step++;
      }

      // 역방향 탐색
      step = 1;
      while (true) {
        let nr = r - dr * step, nc = c - dc * step;
        if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) break;
        if (board[nr][nc] === p) count++;
        else if (board[nr][nc] === 0) { openEnds++; break; }
        else break;
        step++;
      }

      if (count >= 5) return 100000; // 5목 완성
      if (count === 4) {
        if (openEnds === 2) return 10000; // 열린 4
        if (openEnds === 1) return 1500;  // 닫힌 4
      }
      if (count === 3) {
        if (openEnds === 2) return 2000;  // 열린 3 (가장 위협적)
        if (openEnds === 1) return 200;   // 닫힌 3
      }
      if (count === 2) {
        if (openEnds === 2) return 100;
        if (openEnds === 1) return 20;
      }
      return 1;
    }

    function evaluatePosition(r, c, p) {
      const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
      let score = 0;
      for (let [dr, dc] of dirs) {
        score += evaluateLine(r, c, dr, dc, p);
      }
      return score;
    }

    function aiTurn() {
      let bestMove = null;
      let maxScore = -Infinity;

      // 1. 내가 즉시 이기는 자리가 있는지 확인 (5목)
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) {
            board[r][c] = 2;
            if (checkWin(r, c, 2)) {
              board[r][c] = 0;
              placeMove(r, c, 2);
              return;
            }
            board[r][c] = 0;
          }
        }
      }

      // 2. 상대(플레이어)가 이기는 자리 즉시 차단 (5목 방어)
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) {
            board[r][c] = 1;
            if (checkWin(r, c, 1)) {
              board[r][c] = 0;
              placeMove(r, c, 2);
              return;
            }
            board[r][c] = 0;
          }
        }
      }

      // 3. 패턴 점수 전수 계산
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) {
            // 공격 가치 (AI: 2) & 방어 가치 (유저: 1)
            let attackScore = evaluatePosition(r, c, 2);
            let defenseScore = evaluatePosition(r, c, 1);

            // 중앙에 가까울수록 가산점 (바둑판 크기 11)
            let centerBonus = (5 - Math.abs(r - 5)) + (5 - Math.abs(c - 5));

            let totalScore = 0;
            if (difficulty === 'hard') {
              // 고수 모드: 공격 점수와 방어 점수를 철저하게 종합 (수비 우선도 높음)
              totalScore = (attackScore * 1.2) + (defenseScore * 1.5) + centerBonus;
            } else {
              // 보통 모드: 약간의 무작위성 허용
              totalScore = attackScore + defenseScore + (Math.random() * 80);
            }

            if (totalScore > maxScore) {
              maxScore = totalScore;
              bestMove = { r, c };
            }
          }
        }
      }

      if (bestMove) {
        placeMove(bestMove.r, bestMove.c, 2);
      }
    }

    function checkWin(r, c, p) {
      const dirs = [[1,0], [0,1], [1,1], [1,-1]];
      for (let [dr, dc] of dirs) {
        let count = 1;
        for (let step = 1; step <= 4; step++) {
          let nr = r + dr * step, nc = c + dc * step;
          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === p) count++;
          else break;
        }
        for (let step = 1; step <= 4; step++) {
          let nr = r - dr * step, nc = c - dc * step;
          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === p) count++;
          else break;
        }
        if (count >= 5) return true;
      }
      return false;
    }

    function updateUI() {
      const dot = document.getElementById('turn-dot');
      const text = document.getElementById('turn-text');
      if (currentPlayer === 1) {
        dot.className = 'w-3.5 h-3.5 rounded-full bg-black shadow';
        text.textContent = '흑돌 차례';
      } else {
        dot.className = 'w-3.5 h-3.5 rounded-full bg-white border border-gray-400 shadow';
        text.textContent = '컴퓨터 수읽기 중...';
      }
    }

    function endGame(winner) {
      isGameOver = true;
      playWinSound();
      const modal = document.getElementById('winModal');
      const title = document.getElementById('winTitle');
      const desc = document.getElementById('winDesc');
      const emoji = document.getElementById('winEmoji');

      if (winner === 1) {
        emoji.textContent = "🏆";
        title.textContent = "흑돌 승리! 🎉";
        desc.textContent = "고수 인공지능을 멋지게 꺾으셨습니다! 대단하세요!";
      } else {
        emoji.textContent = "🤖";
        title.textContent = "컴퓨터 승리! 👏";
        desc.textContent = "컴퓨터가 한 수 앞섰네요. 다시 도전해보세요!";
      }
      modal.classList.remove('hidden');
    }

    function undoMove() {
      if (history.length === 0 || isGameOver) return;
      playUndoSound();
      // AI 모드는 컴퓨터와 유저 수 2개를 한 번에 무르기
      const steps = history.length >= 2 ? 2 : 1;
      for (let i = 0; i < steps; i++) {
        const last = history.pop();
        if (last) board[last.r][last.c] = 0;
      }
      currentPlayer = 1;
      updateUI();
      drawBoard();
    }

    function resetGame() {
      board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      history = [];
      currentPlayer = 1;
      isGameOver = false;
      document.getElementById('winModal').classList.add('hidden');
      updateUI();
      drawBoard();
    }

    function setDifficulty(diff) {
      difficulty = diff;
      document.getElementById('diff-hard').className = diff === 'hard' ? 'text-xs px-2.5 py-1 rounded-lg font-bold bg-rose-600 text-white shadow-sm' : 'text-xs px-2.5 py-1 rounded-lg font-bold bg-gray-100 text-gray-700';
      document.getElementById('diff-normal').className = diff === 'normal' ? 'text-xs px-2.5 py-1 rounded-lg font-bold bg-amber-600 text-white shadow-sm' : 'text-xs px-2.5 py-1 rounded-lg font-bold bg-gray-100 text-gray-700';
      resetGame();
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', resizeCanvas);
    setTimeout(resizeCanvas, 100);
  </script>
</body>
</html>
