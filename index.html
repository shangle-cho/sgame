<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>두뇌 힐링 게임 삼총사 🃏⚫✨</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
    }
    .card-flip {
      perspective: 1000px;
    }
    .card-inner {
      transition: transform 0.4s;
      transform-style: preserve-3d;
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      backface-visibility: hidden;
    }
    .card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 select-none">

  <!-- ================= 1. 메인 첫 화면 (로비) ================= -->
  <section id="lobbyScreen" class="w-full max-w-xl my-auto flex flex-col items-center py-6 px-3">
    <div class="inline-block bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs sm:text-sm font-bold px-4 py-1.5 rounded-full mb-3 shadow">
      ✨ 부담 없이 즐기는 두뇌 게임 3종
    </div>
    <h1 class="text-3xl sm:text-4xl font-black text-amber-100 mb-2 tracking-tight text-center">클래식 게임 라운지 🃏</h1>
    <p class="text-xs sm:text-sm text-slate-400 mb-6 text-center">원하는 게임을 콕 눌러보세요!</p>

    <div class="w-full flex flex-col gap-4">
      <!-- 1) 포커 하이로우 -->
      <button onclick="openGame('highlow')" class="w-full bg-gradient-to-r from-emerald-800 to-teal-700 hover:from-emerald-700 hover:to-teal-600 border-2 border-emerald-400/60 p-5 rounded-3xl shadow-xl flex items-center justify-between active:scale-95 transition text-left">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 text-2xl font-black bg-black/40 rounded-2xl border border-emerald-400/30 text-emerald-300 flex items-center justify-center shrink-0">
            ♠ A
          </div>
          <div>
            <h2 class="text-lg sm:text-xl font-black text-white">포커 하이로우 (UP & DOWN)</h2>
            <p class="text-xs sm:text-sm text-emerald-200/80 mt-0.5">다음 카드가 더 높을까? 낮을까?</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-emerald-300 text-lg pr-2"></i>
      </button>

      <!-- 2) 기억력 카드 뒤집기 -->
      <button onclick="openGame('card')" class="w-full bg-gradient-to-r from-indigo-800 to-purple-700 hover:from-indigo-700 hover:to-purple-600 border-2 border-indigo-400/60 p-5 rounded-3xl shadow-xl flex items-center justify-between active:scale-95 transition text-left">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 text-3xl bg-black/40 rounded-2xl border border-indigo-400/30 flex items-center justify-center shrink-0">
            🃏
          </div>
          <div>
            <h2 class="text-lg sm:text-xl font-black text-white">기억력 쑥쑥! 카드 뒤집기</h2>
            <p class="text-xs sm:text-sm text-indigo-200/80 mt-0.5">숨겨진 카드를 열어 짝을 맞춰봐요</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-indigo-300 text-lg pr-2"></i>
      </button>

      <!-- 3) 두뇌 오목 -->
      <button onclick="openGame('omok')" class="w-full bg-gradient-to-r from-amber-800 to-amber-700 hover:from-amber-700 hover:to-amber-600 border-2 border-amber-500/60 p-5 rounded-3xl shadow-xl flex items-center justify-between active:scale-95 transition text-left">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 text-3xl bg-black/40 rounded-2xl border border-amber-400/30 flex items-center justify-center shrink-0">
            ⚫⚪
          </div>
          <div>
            <h2 class="text-lg sm:text-xl font-black text-white">두뇌 튼튼 오목 한판</h2>
            <p class="text-xs sm:text-sm text-amber-200/80 mt-0.5">시원시원한 대형 바둑판 & AI 대전</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-amber-300 text-lg pr-2"></i>
      </button>
    </div>
  </section>

  <!-- ================= 2. 포커 하이로우 화면 (화면 꽉 찬 특대형 카드) ================= -->
  <section id="highlowScreen" class="w-full max-w-2xl hidden flex-col justify-between h-full flex-1 gap-4 py-2">
    <!-- 상단 바 -->
    <div class="w-full flex items-center justify-between bg-slate-900/95 px-4 py-3 rounded-2xl border border-slate-800 shadow-md">
      <button onclick="goHome()" class="text-sm font-bold text-slate-200 px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl active:scale-95 flex items-center gap-1.5 border border-slate-700 transition">
        <i class="fa-solid fa-house"></i> 홈
      </button>
      <div class="text-center">
        <span class="text-base sm:text-lg font-black text-emerald-400">포커 하이로우 ♠</span>
      </div>
      <div class="flex gap-2 text-right">
        <div class="bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">
          <span class="text-[10px] text-slate-400 block font-bold">연승</span>
          <span id="streakText" class="text-sm sm:text-base font-black text-amber-300">0 연승</span>
        </div>
        <div class="bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">
          <span class="text-[10px] text-slate-400 block font-bold">최고</span>
          <span id="bestStreakText" class="text-sm sm:text-base font-black text-cyan-300">0</span>
        </div>
      </div>
    </div>

    <!-- 초대형 카지노 테이블 무대 -->
    <div class="my-auto w-full flex flex-col items-center justify-center">
      <div class="bg-[#0f4c3a] p-6 sm:p-10 rounded-3xl sm:rounded-[36px] shadow-[inset_0_0_50px_rgba(0,0,0,0.85)] border-4 border-[#08291f] w-full flex flex-col items-center justify-center">
        
        <p class="text-sm sm:text-base text-emerald-100 font-bold mb-5 text-center drop-shadow">
          다음 카드는 이 카드보다 높을까요? 낮을까요?
        </p>

        <!-- 포커 카드 2장 (대형 크기 w-40 sm:w-52 / h-64 sm:h-80) -->
        <div class="flex items-center justify-center gap-4 sm:gap-8 w-full">
          <!-- 현재 카드 -->
          <div id="currentCardEl" class="w-40 h-64 sm:w-52 sm:h-80 bg-white rounded-2xl sm:rounded-3xl shadow-2xl border-2 sm:border-4 border-slate-300 flex flex-col justify-between p-4 sm:p-5 text-slate-900 transition-all duration-300">
            <div class="flex flex-col items-start leading-none">
              <span id="currentCardRankTop" class="text-3xl sm:text-4xl font-black">7</span>
              <span id="currentCardSuitTop" class="text-2xl sm:text-3xl mt-0.5">♠</span>
            </div>
            <div id="currentCardCenter" class="text-7xl sm:text-8xl self-center">♠</div>
            <div class="flex flex-col items-end leading-none rotate-180">
              <span id="currentCardRankBottom" class="text-3xl sm:text-4xl font-black">7</span>
              <span id="currentCardSuitBottom" class="text-2xl sm:text-3xl mt-0.5">♠</span>
            </div>
          </div>

          <!-- 다음 카드 (물음표 뒷면) -->
          <div id="nextCardEl" class="w-40 h-64 sm:w-52 sm:h-80 bg-gradient-to-br from-blue-700 via-indigo-800 to-indigo-950 rounded-2xl sm:rounded-3xl shadow-2xl border-2 sm:border-4 border-blue-400 flex flex-col items-center justify-center p-4 text-white">
            <span class="text-6xl sm:text-7xl mb-3">❓</span>
            <span class="text-xs sm:text-sm font-black text-blue-200 tracking-wider">NEXT CARD</span>
          </div>
        </div>

        <p id="hlResultText" class="text-sm sm:text-base font-black text-yellow-300 mt-6 min-h-[1.75rem] text-center drop-shadow">
          카드를 보고 선택하세요! (A는 1, K가 가장 높음)
        </p>
      </div>
    </div>

    <!-- 하단 예측 버튼 (큼직하고 묵직한 터치 버튼) -->
    <div class="pb-2 grid grid-cols-2 gap-3 sm:gap-4 w-full">
      <button onclick="guessHighLow('HIGH')" class="bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-black py-4 sm:py-5 rounded-2xl shadow-xl text-lg sm:text-xl flex items-center justify-center gap-2 active:scale-95 transition">
        <i class="fa-solid fa-arrow-up"></i>
        <span>더 높다 (HIGH)</span>
      </button>
      <button onclick="guessHighLow('LOW')" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black py-4 sm:py-5 rounded-2xl shadow-xl text-lg sm:text-xl flex items-center justify-center gap-2 active:scale-95 transition">
        <i class="fa-solid fa-arrow-down"></i>
        <span>더 낮다 (LOW)</span>
      </button>
    </div>
  </section>

  <!-- ================= 3. 카드 뒤집기 화면 ================= -->
  <section id="cardScreen" class="w-full max-w-xl hidden flex-col justify-between h-full flex-1 gap-4 py-2">
    <div class="w-full flex items-center justify-between bg-slate-900/95 px-4 py-3 rounded-2xl border border-slate-800 shadow">
      <button onclick="goHome()" class="text-sm font-bold text-slate-200 px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl active:scale-95 flex items-center gap-1.5 border border-slate-700 transition">
        <i class="fa-solid fa-house"></i> 홈
      </button>
      <h2 class="text-base sm:text-lg font-black text-indigo-400">카드 뒤집기 🃏</h2>
      <div class="bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl text-right">
        <span class="text-[10px] text-slate-400 block font-bold">시도 횟수</span>
        <span id="cardMovesText" class="text-sm sm:text-base font-black text-amber-300">0</span>
      </div>
    </div>

    <div class="my-auto p-1 flex items-center justify-center w-full">
      <div class="bg-slate-900 p-4 sm:p-5 rounded-3xl shadow-2xl border-2 border-slate-800 w-full aspect-square max-w-lg flex items-center justify-center">
        <div id="cardGrid" class="w-full h-full grid grid-cols-4 gap-2.5 sm:gap-3.5"></div>
      </div>
    </div>

    <div class="pb-2 w-full">
      <button onclick="initCardGame()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 sm:py-5 rounded-2xl shadow-lg text-base active:scale-95 transition">
        🔄 새 게임 시작하기
      </button>
    </div>
  </section>

  <!-- ================= 4. 두뇌 오목 화면 ================= -->
  <section id="omokScreen" class="w-full max-w-xl hidden flex-col justify-between h-full flex-1 gap-4 py-2">
    <div class="w-full flex items-center justify-between bg-slate-900/95 px-4 py-3 rounded-2xl border border-slate-800 shadow">
      <button onclick="goHome()" class="text-sm font-bold text-slate-200 px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl active:scale-95 flex items-center gap-1.5 border border-slate-700 transition">
        <i class="fa-solid fa-house"></i> 홈
      </button>
      <div class="flex gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800">
        <button id="omok-diff-hard" onclick="setOmokDiff('hard')" class="text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-rose-600 text-white">어려움</button>
        <button id="omok-diff-normal" onclick="setOmokDiff('normal')" class="text-xs sm:text-sm px-3 py-1 rounded-lg font-bold text-slate-400">보통</button>
      </div>
      <div class="flex items-center gap-2">
        <div id="omok-turn-dot" class="w-4 h-4 rounded-full bg-black shadow border border-white/30"></div>
        <span id="omok-turn-text" class="text-sm font-black text-amber-300">내 차례</span>
      </div>
    </div>

    <!-- 대형 바둑판 -->
    <div class="my-auto p-1 flex items-center justify-center w-full">
      <div class="bg-[#E4A054] p-2 sm:p-3 rounded-3xl shadow-2xl border-4 border-[#8B5A2B] w-full aspect-square max-w-lg flex items-center justify-center">
        <canvas id="omokCanvas" class="w-full h-full cursor-pointer rounded-2xl"></canvas>
      </div>
    </div>

    <div class="pb-2 flex gap-3 w-full">
      <button onclick="undoOmok()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-4 rounded-2xl border border-slate-700 text-sm sm:text-base active:scale-95 transition">
        ↩ 무르기
      </button>
      <button onclick="resetOmok()" class="flex-[2] bg-amber-600 hover:bg-amber-500 text-white font-black py-4 rounded-2xl shadow-lg text-sm sm:text-base active:scale-95 transition">
        🔄 새 판 시작
      </button>
    </div>
  </section>

  <!-- 결과 알림 모달 -->
  <div id="gameModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border-2 border-amber-400 rounded-3xl p-6 sm:p-8 text-center max-w-xs sm:max-w-sm w-full shadow-2xl">
      <div id="modalEmoji" class="text-5xl sm:text-6xl mb-3">🏆</div>
      <h3 id="modalTitle" class="text-xl sm:text-2xl font-black text-white mb-2">승리!</h3>
      <p id="modalDesc" class="text-sm text-slate-300 font-bold mb-6">멋지게 해내셨습니다!</p>
      <button onclick="closeModal()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-base py-3.5 rounded-xl active:scale-95 transition">
        확인 👍
      </button>
    </div>
  </div>

  <script>
    // --- 효과음 시스템 (Web Audio) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSfx(type) {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'cardFlip') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.07);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
        } else if (type === 'winPoint') {
          [523, 659, 783, 1046].forEach((f, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.frequency.setValueAtTime(f, now + i * 0.06);
            g.gain.setValueAtTime(0.2, now + i * 0.06);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.06 + 0.12);
            o.connect(g); g.connect(ctx.destination);
            o.start(now + i * 0.06); o.stop(now + i * 0.06 + 0.13);
          });
          return;
        } else if (type === 'fail') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(70, now + 0.2);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        } else if (type === 'stone') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
          gain.gain.setValueAtTime(0.7, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        }
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      } catch(e) {}
    }

    // --- 네비게이션 ---
    function openGame(name) {
      getAudioCtx();
      document.getElementById('lobbyScreen').classList.add('hidden');
      ['highlowScreen', 'cardScreen', 'omokScreen'].forEach(id => {
        const el = document.getElementById(id);
        el.classList.add('hidden');
        el.classList.remove('flex');
      });

      if (name === 'highlow') {
        const el = document.getElementById('highlowScreen');
        el.classList.remove('hidden'); el.classList.add('flex');
        initHighLow();
      } else if (name === 'card') {
        const el = document.getElementById('cardScreen');
        el.classList.remove('hidden'); el.classList.add('flex');
        initCardGame();
      } else if (name === 'omok') {
        const el = document.getElementById('omokScreen');
        el.classList.remove('hidden'); el.classList.add('flex');
        setTimeout(resizeOmok, 50);
      }
    }

    function goHome() {
      ['highlowScreen', 'cardScreen', 'omokScreen'].forEach(id => {
        const el = document.getElementById(id);
        el.classList.add('hidden');
        el.classList.remove('flex');
      });
      document.getElementById('lobbyScreen').classList.remove('hidden');
    }

    function openModal(emoji, title, desc) {
      document.getElementById('modalEmoji').textContent = emoji;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = desc;
      document.getElementById('gameModal').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('gameModal').classList.add('hidden');
    }

    // ==============================================================
    // [1] 포커 하이로우 게임 로직 (High-Low)
    // ==============================================================
    const suits = [
      { symbol: '♠', color: 'text-slate-900' },
      { symbol: '♥', color: 'text-rose-600' },
      { symbol: '♦', color: 'text-red-500' },
      { symbol: '♣', color: 'text-slate-800' }
    ];
    const rankNames = { 1: 'A', 11: 'J', 12: 'Q', 13: 'K' };

    let currentCard = null;
    let streak = 0;
    let bestStreak = 0;
    let isHLGuessed = false;

    function getRandomCard() {
      const val = Math.floor(Math.random() * 13) + 1;
      const suit = suits[Math.floor(Math.random() * suits.length)];
      const name = rankNames[val] || String(val);
      return { val, suit, name };
    }

    function initHighLow() {
      streak = 0;
      document.getElementById('streakText').textContent = '0 연승';
      document.getElementById('hlResultText').textContent = '카드를 보고 선택하세요! (A는 1, K가 13)';
      currentCard = getRandomCard();
      renderCurrentCard(currentCard);
      resetNextCardSlot();
      isHLGuessed = false;
    }

    function renderCurrentCard(card) {
      const topR = document.getElementById('currentCardRankTop');
      const topS = document.getElementById('currentCardSuitTop');
      const center = document.getElementById('currentCardCenter');
      const btmR = document.getElementById('currentCardRankBottom');
      const btmS = document.getElementById('currentCardSuitBottom');

      topR.textContent = card.name;
      btmR.textContent = card.name;
      topS.textContent = card.suit.symbol;
      btmS.textContent = card.suit.symbol;
      center.textContent = card.suit.symbol;

      const cardEl = document.getElementById('currentCardEl');
      cardEl.className = `w-40 h-64 sm:w-52 sm:h-80 bg-white rounded-2xl sm:rounded-3xl shadow-2xl border-2 sm:border-4 border-slate-300 flex flex-col justify-between p-4 sm:p-5 ${card.suit.color} transition-all duration-300`;
    }

    function resetNextCardSlot() {
      const slot = document.getElementById('nextCardEl');
      slot.className = 'w-40 h-64 sm:w-52 sm:h-80 bg-gradient-to-br from-blue-700 via-indigo-800 to-indigo-950 rounded-2xl sm:rounded-3xl shadow-2xl border-2 sm:border-4 border-blue-400 flex flex-col items-center justify-center p-4 text-white';
      slot.innerHTML = `
        <span class="text-6xl sm:text-7xl mb-3">❓</span>
        <span class="text-xs sm:text-sm font-black text-blue-200 tracking-wider">NEXT CARD</span>
      `;
    }

    function guessHighLow(choice) {
      if (isHLGuessed) return;
      isHLGuessed = true;

      let nextCard = getRandomCard();
      while (nextCard.val === currentCard.val) {
        nextCard = getRandomCard();
      }

      playSfx('cardFlip');

      const slot = document.getElementById('nextCardEl');
      slot.className = `w-40 h-64 sm:w-52 sm:h-80 bg-white rounded-2xl sm:rounded-3xl shadow-2xl border-2 sm:border-4 border-yellow-400 flex flex-col justify-between p-4 sm:p-5 ${nextCard.suit.color} animate-pulse`;
      slot.innerHTML = `
        <div class="flex flex-col items-start leading-none">
          <span class="text-3xl sm:text-4xl font-black">${nextCard.name}</span>
          <span class="text-2xl sm:text-3xl mt-0.5">${nextCard.suit.symbol}</span>
        </div>
        <div class="text-7xl sm:text-8xl self-center">${nextCard.suit.symbol}</div>
        <div class="flex flex-col items-end leading-none rotate-180">
          <span class="text-3xl sm:text-4xl font-black">${nextCard.name}</span>
          <span class="text-2xl sm:text-3xl mt-0.5">${nextCard.suit.symbol}</span>
        </div>
      `;

      const isHigh = nextCard.val > currentCard.val;
      const isWin = (choice === 'HIGH' && isHigh) || (choice === 'LOW' && !isHigh);

      const resText = document.getElementById('hlResultText');

      if (isWin) {
        streak++;
        if (streak > bestStreak) {
          bestStreak = streak;
          document.getElementById('bestStreakText').textContent = bestStreak;
        }
        document.getElementById('streakText').textContent = `${streak} 연승 🔥`;
        resText.textContent = `🎉 적중! (${nextCard.name}이(가) 나왔습니다!)`;
        playSfx('winPoint');

        if (streak === 5 || streak === 10) {
          openModal('🔥', `${streak}연승 대기록 달성!`, '엄청난 감각이십니다! 계속해서 기록을 깨보세요!');
        }
      } else {
        streak = 0;
        document.getElementById('streakText').textContent = '0 연승';
        resText.textContent = `앗! 아쉽네요 (${nextCard.name}이(가) 나왔습니다)`;
        playSfx('fail');
      }

      setTimeout(() => {
        currentCard = nextCard;
        renderCurrentCard(currentCard);
        resetNextCardSlot();
        isHLGuessed = false;
      }, 950);
    }

    // ==============================================================
    // [2] 카드 뒤집기
    // ==============================================================
    const cardIcons = ['🍎', '🍌', '🍓', '🍇', '🍉', '🍍', '🍒', '🥝'];
    let cardDeck = [];
    let flippedCards = [];
    let cardMoves = 0;
    let cardMatchedCount = 0;
    let cardLock = false;

    function initCardGame() {
      const items = [...cardIcons, ...cardIcons];
      items.sort(() => Math.random() - 0.5);
      cardDeck = items.map((icon, idx) => ({
        id: idx,
        icon: icon,
        matched: false
      }));
      flippedCards = [];
      cardMoves = 0;
      cardMatchedCount = 0;
      cardLock = false;
      document.getElementById('cardMovesText').textContent = cardMoves;

      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';
      cardDeck.forEach((c, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'w-full h-full card-flip cursor-pointer';
        wrap.innerHTML = `
          <div id="card-inner-${idx}" class="card-inner w-full h-full relative rounded-2xl shadow-md border border-slate-700">
            <div class="card-front absolute inset-0 bg-gradient-to-br from-indigo-700 to-indigo-900 rounded-2xl flex items-center justify-center text-white text-2xl sm:text-3xl font-black border border-indigo-400/40">
              ❓
            </div>
            <div class="card-back absolute inset-0 bg-slate-800 rounded-2xl flex items-center justify-center text-3xl sm:text-4xl border-2 border-amber-400">
              ${c.icon}
            </div>
          </div>
        `;
        wrap.onclick = () => flipCard(idx);
        grid.appendChild(wrap);
      });
    }

    function flipCard(idx) {
      if (cardLock) return;
      const card = cardDeck[idx];
      if (card.matched || flippedCards.includes(idx)) return;

      playSfx('cardFlip');
      document.getElementById(`card-inner-${idx}`).classList.add('flipped');
      flippedCards.push(idx);

      if (flippedCards.length === 2) {
        cardMoves++;
        document.getElementById('cardMovesText').textContent = cardMoves;
        const [firstIdx, secondIdx] = flippedCards;
        const c1 = cardDeck[firstIdx];
        const c2 = cardDeck[secondIdx];

        if (c1.icon === c2.icon) {
          playSfx('winPoint');
          c1.matched = true;
          c2.matched = true;
          cardMatchedCount += 2;
          flippedCards = [];

          if (cardMatchedCount === 16) {
            setTimeout(() => {
              openModal('🃏', '기억력 카드 완벽 클리어!', `${cardMoves}번 만에 모든 카드의 짝을 다 찾으셨어요!`);
            }, 400);
          }
        } else {
          cardLock = true;
          setTimeout(() => {
            document.getElementById(`card-inner-${firstIdx}`).classList.remove('flipped');
            document.getElementById(`card-inner-${secondIdx}`).classList.remove('flipped');
            flippedCards = [];
            cardLock = false;
          }, 800);
        }
      }
    }

    // ==============================================================
    // [3] 시원한 대형 오목
    // ==============================================================
    const omokCanvas = document.getElementById('omokCanvas');
    const omokCtx = omokCanvas.getContext('2d');
    const OMOK_SIZE = 11;
    let omokBoard = Array.from({ length: OMOK_SIZE }, () => Array(OMOK_SIZE).fill(0));
    let omokPlayer = 1;
    let omokHistory = [];
    let omokOver = false;

    function resizeOmok() {
      const rect = omokCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      omokCanvas.width = rect.width * dpr;
      omokCanvas.height = rect.height * dpr;
      omokCtx.scale(dpr, dpr);
      drawOmok();
    }

    function getOmokCellSize() {
      return omokCanvas.getBoundingClientRect().width / (OMOK_SIZE + 0.3);
    }
    function getOmokOffset() {
      return getOmokCellSize() * 0.65;
    }

    function drawOmok() {
      const rect = omokCanvas.getBoundingClientRect();
      const cellSize = getOmokCellSize();
      const offset = getOmokOffset();
      omokCtx.clearRect(0, 0, rect.width, rect.height);

      omokCtx.strokeStyle = '#4A2A10';
      omokCtx.lineWidth = 1.8;

      for (let i = 0; i < OMOK_SIZE; i++) {
        const pos = offset + cellSize * i;
        omokCtx.beginPath();
        omokCtx.moveTo(offset, pos);
        omokCtx.lineTo(offset + cellSize * (OMOK_SIZE - 1), pos);
        omokCtx.stroke();
        omokCtx.beginPath();
        omokCtx.moveTo(pos, offset);
        omokCtx.lineTo(pos, offset + cellSize * (OMOK_SIZE - 1));
        omokCtx.stroke();
      }

      const center = offset + cellSize * 5;
      omokCtx.fillStyle = '#4A2A10';
      omokCtx.beginPath();
      omokCtx.arc(center, center, 5, 0, Math.PI * 2);
      omokCtx.fill();

      for (let r = 0; r < OMOK_SIZE; r++) {
        for (let c = 0; c < OMOK_SIZE; c++) {
          if (omokBoard[r][c] !== 0) drawOmokStone(r, c, omokBoard[r][c]);
        }
      }

      if (omokHistory.length > 0) {
        const last = omokHistory[omokHistory.length - 1];
        omokCtx.fillStyle = '#EF4444';
        omokCtx.beginPath();
        omokCtx.arc(offset + cellSize * last.c, offset + cellSize * last.r, cellSize * 0.16, 0, Math.PI * 2);
        omokCtx.fill();
      }
    }

    function drawOmokStone(r, c, p) {
      const cellSize = getOmokCellSize();
      const offset = getOmokOffset();
      const x = offset + cellSize * c;
      const y = offset + cellSize * r;
      const radius = cellSize * 0.44;

      omokCtx.save();
      omokCtx.beginPath();
      omokCtx.arc(x, y, radius, 0, Math.PI * 2);
      omokCtx.shadowColor = 'rgba(0,0,0,0.4)';
      omokCtx.shadowBlur = 4;
      omokCtx.shadowOffsetX = 2;
      omokCtx.shadowOffsetY = 2;

      const grad = omokCtx.createRadialGradient(x - radius/3, y - radius/3, radius/10, x, y, radius);
      if (p === 1) {
        grad.addColorStop(0, '#555'); grad.addColorStop(1, '#111');
      } else {
        grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#ddd');
      }
      omokCtx.fillStyle = grad;
      omokCtx.fill();
      omokCtx.restore();
    }

    omokCanvas.addEventListener('click', (e) => {
      if (omokOver || omokPlayer === 2) return;
      const rect = omokCanvas.getBoundingClientRect();
      const cellSize = getOmokCellSize();
      const offset = getOmokOffset();
      const col = Math.round((e.clientX - rect.left - offset) / cellSize);
      const row = Math.round((e.clientY - rect.top - offset) / cellSize);

      if (row >= 0 && row < OMOK_SIZE && col >= 0 && col < OMOK_SIZE && omokBoard[row][col] === 0) {
        placeOmok(row, col, 1);
      }
    });

    function placeOmok(r, c, p) {
      omokBoard[r][c] = p;
      omokHistory.push({ r, c, p });
      drawOmok();
      playSfx('stone');

      if (checkOmokWin(r, c, p)) {
        omokOver = true;
        if (p === 1) openModal('🏆', '오목 승리!', '축하합니다! 인공지능을 멋지게 이기셨어요!');
        else openModal('🤖', '컴퓨터 승리!', '아쉽네요! 한 번 더 도전해보세요!');
        return;
      }

      omokPlayer = (p === 1) ? 2 : 1;
      updateOmokUI();

      if (omokPlayer === 2 && !omokOver) {
        setTimeout(omokAiMove, 250);
      }
    }

    function checkOmokWin(r, c, p) {
      const dirs = [[1,0], [0,1], [1,1], [1,-1]];
      for (let [dr, dc] of dirs) {
        let count = 1;
        for (let s = 1; s <= 4; s++) {
          let nr = r + dr*s, nc = c + dc*s;
          if (nr>=0 && nr<OMOK_SIZE && nc>=0 && nc<OMOK_SIZE && omokBoard[nr][nc] === p) count++; else break;
        }
        for (let s = 1; s <= 4; s++) {
          let nr = r - dr*s, nc = c - dc*s;
          if (nr>=0 && nr<OMOK_SIZE && nc>=0 && nc<OMOK_SIZE && omokBoard[nr][nc] === p) count++; else break;
        }
        if (count >= 5) return true;
      }
      return false;
    }

    function omokAiMove() {
      for (let target of [2, 1]) {
        for (let r = 0; r < OMOK_SIZE; r++) {
          for (let c = 0; c < OMOK_SIZE; c++) {
            if (omokBoard[r][c] === 0) {
              omokBoard[r][c] = target;
              if (checkOmokWin(r, c, target)) {
                omokBoard[r][c] = 0;
                placeOmok(r, c, 2);
                return;
              }
              omokBoard[r][c] = 0;
            }
          }
        }
      }
      let bestMove = null;
      let maxScore = -9999;
      for (let r = 0; r < OMOK_SIZE; r++) {
        for (let c = 0; c < OMOK_SIZE; c++) {
          if (omokBoard[r][c] === 0) {
            let centerBonus = (5 - Math.abs(r - 5)) + (5 - Math.abs(c - 5));
            let score = centerBonus + Math.random() * 20;
            if (score > maxScore) { maxScore = score; bestMove = { r, c }; }
          }
        }
      }
      if (bestMove) placeOmok(bestMove.r, bestMove.c, 2);
    }

    function updateOmokUI() {
      const dot = document.getElementById('omok-turn-dot');
      const text = document.getElementById('omok-turn-text');
      if (omokPlayer === 1) {
        dot.className = 'w-4 h-4 rounded-full bg-black shadow border border-white/20';
        text.textContent = '내 차례';
      } else {
        dot.className = 'w-4 h-4 rounded-full bg-white shadow';
        text.textContent = '생각 중...';
      }
    }

    function undoOmok() {
      if (omokHistory.length === 0 || omokOver) return;
      playSfx('stone');
      const steps = omokHistory.length >= 2 ? 2 : 1;
      for (let i = 0; i < steps; i++) {
        const last = omokHistory.pop();
        if (last) omokBoard[last.r][last.c] = 0;
      }
      omokPlayer = 1;
      updateOmokUI();
      drawOmok();
    }

    function resetOmok() {
      omokBoard = Array.from({ length: OMOK_SIZE }, () => Array(OMOK_SIZE).fill(0));
      omokHistory = [];
      omokPlayer = 1;
      omokOver = false;
      updateOmokUI();
      drawOmok();
    }

    function setOmokDiff(d) {
      document.getElementById('omok-diff-hard').className = d === 'hard' ? 'text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-rose-600 text-white' : 'text-xs sm:text-sm px-3 py-1 rounded-lg font-bold text-slate-400';
      document.getElementById('omok-diff-normal').className = d === 'normal' ? 'text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-amber-600 text-white' : 'text-xs sm:text-sm px-3 py-1 rounded-lg font-bold text-slate-400';
      resetOmok();
    }

    window.addEventListener('resize', resizeOmok);
  </script>
</body>
</html>
