<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘 밤 꿀잠 플레이어 🌙</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-5 select-none pb-8">

  <!-- 헤더 영역 -->
  <header class="w-full max-w-sm text-center pt-4">
    <div class="inline-block bg-indigo-900/60 text-indigo-300 text-xs font-bold px-3 py-1 rounded-full mb-2 border border-indigo-700/50">
      ✨ 실시간 최신 유튜브 연결
    </div>
    <h1 class="text-2xl font-black text-indigo-100">잠 솔솔 수면 소리 🌙</h1>
    <p class="text-slate-400 text-xs mt-1">누르면 유튜브 최신 영상 목록이 바로 열려요</p>
  </header>

  <!-- 5가지 단순 검색 리스트 -->
  <main class="w-full max-w-sm my-auto flex flex-col gap-3">

    <!-- 1. 수면음악 -->
    <a href="https://www.youtube.com/results?search_query=수면음악" target="_blank"
       class="flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-2xl">🎵</div>
        <div>
          <h2 class="text-base font-bold text-white">수면음악</h2>
          <p class="text-xs text-slate-400">실시간 인기 수면 피아노·음악</p>
        </div>
      </div>
      <i class="fa-solid fa-arrow-up-right-from-square text-indigo-400 text-sm"></i>
    </a>

    <!-- 2. 수면이야기 -->
    <a href="https://www.youtube.com/results?search_query=수면이야기" target="_blank"
       class="flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-2xl">📖</div>
        <div>
          <h2 class="text-base font-bold text-white">수면이야기</h2>
          <p class="text-xs text-slate-400">조곤조곤 전래동화·오디오북</p>
        </div>
      </div>
      <i class="fa-solid fa-arrow-up-right-from-square text-amber-400 text-sm"></i>
    </a>

    <!-- 3. 빗소리 -->
    <a href="https://www.youtube.com/results?search_query=빗소리" target="_blank"
       class="flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-2xl">🌧️</div>
        <div>
          <h2 class="text-base font-bold text-white">빗소리</h2>
          <p class="text-xs text-slate-400">토닥토닥 밤 창가 빗소리</p>
        </div>
      </div>
      <i class="fa-solid fa-arrow-up-right-from-square text-blue-400 text-sm"></i>
    </a>

    <!-- 4. 모닥불 -->
    <a href="https://www.youtube.com/results?search_query=모닥불" target="_blank"
       class="flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-orange-500/20 text-orange-400 flex items-center justify-center text-2xl">🔥</div>
        <div>
          <h2 class="text-base font-bold text-white">모닥불</h2>
          <p class="text-xs text-slate-400">타닥타닥 따뜻한 장작 타는 소리</p>
        </div>
      </div>
      <i class="fa-solid fa-arrow-up-right-from-square text-orange-400 text-sm"></i>
    </a>

    <!-- 5. 수면명상 -->
    <a href="https://www.youtube.com/results?search_query=수면명상" target="_blank"
       class="flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-2xl">🧘</div>
        <div>
          <h2 class="text-base font-bold text-white">수면명상</h2>
          <p class="text-xs text-slate-400">온몸의 긴장을 푸는 바디스캔</p>
        </div>
      </div>
      <i class="fa-solid fa-arrow-up-right-from-square text-purple-400 text-sm"></i>
    </a>

  </main>

  <!-- 하단 메시지 -->
  <footer class="w-full max-w-sm pb-4 text-center text-xs text-slate-500">
    <p>터치하면 유튜브 최신 검색결과로 깔끔하게 열려요 💤</p>
  </footer>

</body>
</html>
