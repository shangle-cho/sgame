<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>두뇌 튼튼 오목 한판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center justify-between p-4 select-none">

  <!-- 헤더 영역 -->
  <header class="w-full max-w-sm text-center pt-2">
    <div class="inline-block bg-amber-200 text-amber-900 text-xs font-bold px-3 py-1 rounded-full mb-1">
      🧠 두뇌 활력 오목 게임
    </div>
    <h1 class="text-2xl font-black text-gray-900">두뇌 튼튼 오목 한판</h1>
    
    <!-- 모드 선택 & 차례 안내 -->
    <div class="mt-3 flex items-center justify-between bg-white px-3 py-2 rounded-xl shadow-sm border border-amber-200">
      <div class="flex gap-1">
        <button id="mode-ai" onclick="setMode('ai')" class="text-xs px-2.5 py-1.5 rounded-lg font-bold bg-amber-600 text-white">vs 컴퓨터</button>
        <button id="mode-p2p" onclick="setMode('p2p')" class="text-xs px-2.5 py-1.5 rounded-lg font-bold bg-gray-100 text-gray-700">2인 대결</button>
      </div>
      <div class="flex items-center gap-1.5">
        <div id="turn-dot" class="w-3.5 h-3.5 rounded-full bg-black"></div>
        <span id="turn-text" class="text-xs font-black text-gray-800">흑돌 차례</span>
      </div>
    </div>
  </header>

  <!-- 바둑판 캔버스 영역 -->
  <main class="w-full max-w-sm flex items-center justify-center my-auto">
    <div class="bg-[#E4A054] p-3 rounded-2xl shadow-xl border-4 border-[#8B5A2B] w-full aspect-square flex items-center justify-center">
      <canvas id="omokCanvas" class="w-full h-full cursor-pointer"></canvas>
    </div>
  </main>

  <!-- 하단 조작 버튼 -->
  <footer class="w-full max-w-sm pb-4 flex gap-2">
    <button onclick="undoMove()" class="flex-1 bg-white hover:bg-gray-50 text-gray-700 font-bold py-3 rounded-xl border border-gray-300 shadow-sm text-sm active:scale-95 transition">
      ↩ 무르기
    </button>
    <button onclick="resetGame()" class="flex-[2] bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl shadow-md text-sm active:scale-95 transition">
      🔄 새 판 시작하기
    </button>
  </footer>

  <!-- 승리 모달 -->
  <div id="winModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl border-4 border-amber-400">
      <div class="text-5xl mb-2">🏆</div>
      <h2 id="winTitle" class="text-2xl font-black text-gray-800 mb-1">흑돌 승리!</h2>
      <p id="winDesc" class="text-gray-600 text-sm font-bold mb-5">축하드립니다! 다섯 알을 멋지게 이으셨어요!</p>
      <button onclick="resetGame()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-black text-base py-3 rounded-xl shadow-md transition">
        다시 한판 하기 🎯
      </button>
