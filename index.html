<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>러브 & 두뇌 힐링 게임 라운지 💖</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
    }
    .card-flip {
      perspective: 1000px;
    }
    .card-inner {
      transition: transform 0.4s;
      transform-style: preserve-3d;
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      backface-visibility: hidden;
    }
    .card-back {
      transform: rotateY(180deg);
    }
    .gem-cell {
      transition: transform 0.15s ease, background-color 0.2s;
    }
    @keyframes heartFloat {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.15) translateY(-6px); }
    }
    .heart-float {
      animation: heartFloat 0.5s ease-in-out infinite;
    }
    @keyframes popParticle {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.6); opacity: 0; }
    }
    .particle {
      animation: popParticle 0.7s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 select-none overflow-x-hidden">

  <!-- ================= 1. 메인 첫 화면 (로비) ================= -->
  <section id="lobbyScreen" class="w-full max-w-xl my-auto flex flex-col items-center py-6 px-3">
    <div class="inline-block bg-pink-500/20 text-pink-300 border border-pink-500/40 text-xs sm:text-sm font-bold px-4 py-1.5 rounded-full mb-3 shadow">
      💖 사랑 가득 & 두뇌 힐링 라운지
    </div>
    <h1 class="text-3xl sm:text-4xl font-black text-rose-100 mb-2 tracking-tight text-center">달콤한 게임 라운지 🎁</h1>
    <p class="text-xs sm:text-sm text-slate-400 mb-6 text-center">하고 싶은 게임을 골라보세요!</p>

    <div class="w-full flex flex-col gap-3.5">
      <!-- 0) 당신을 위한 하트 누르기 게임 -->
      <button onclick="openGame('loveHeart')" class="w-full bg-gradient-to-r from-rose-600 via-pink-600 to-amber-500 hover:from-rose-500 hover:to-amber-400 border-2 border-pink-300 p-5 rounded-3xl shadow-[0_0_25px_rgba(244,63,94,0.4)] flex items-center justify-between active:scale-95 transition text-left">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 text-3xl bg-white/20 backdrop-blur-sm rounded-2xl border border-white/40 flex items-center justify-center shrink-0 heart-float">
            💖
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="bg-white text-rose-600 text-[10px] font-black px-2 py-0.5 rounded-full">스피드 하트 ⚡</span>
              <h2 class="text-lg sm:text-xl font-black text-white">러브 하트 팡팡!</h2>
            </div>
            <p class="text-xs sm:text-sm text-rose-100/90 mt-0.5">도망치는 하트를 콕 잡으면 특급 쿠폰 당첨!</p>
          </div>
        </div>
        <i class="fa-solid fa-gift text-white text-xl pr-2 animate-bounce"></i>
      </button>

      <!-- 1) 보석 팡팡 -->
      <button onclick="openGame('jewel')" class="w-full bg-gradient-to-r from-purple-800 to-indigo-800 hover:from-purple-700 hover:to-indigo-700 border-2 border-purple-400/60 p-4 sm:p-5 rounded-3xl shadow-xl flex items-center justify-between active:scale-95 transition text-left">
        <div class="flex items-center gap-4">
          <div class="w-13 h-13 text-3xl bg-black/40 rounded-2xl border border-purple-400/30 flex items-center justify-center shrink-0">
            💎
          </div>
          <div>
            <h2 class="text-base sm:text-lg font-black text-white">팡팡! 보석 매치 3</h2>
            <p class="text-xs text-purple-200/80 mt-0.5">같은 색 보석 3개를 이어 팡팡 터뜨려요!</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-purple-300 text-lg pr-2"></i>
      </button>

      <!-- 2) 기억력 카드 뒤집기 -->
      <button onclick="openGame('card')" class="w-full bg-gradient-to-r from-blue-900 to-indigo-900 hover:from-blue-800 hover:to-indigo-800 border-2 border-blue-400/60 p-4 sm:p-5 rounded-3xl shadow-xl flex items-center justify-between active:scale-95 transition text-left">
        <div class="flex items-center gap-4">
          <div class="w-13 h-13 text-3xl bg-black/40 rounded-2xl border border-blue-400/30 flex items-center justify-center shrink-0">
            🃏
          </div>
          <div>
            <h2 class="text-base sm:text-lg font-black text-white">기억력 쑥쑥! 카드 뒤집기</h2>
            <p class="text-xs text-blue-200/80 mt-0.5">숨겨진 카드를 열어 짝을 맞춰봐요</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-blue-300 text-lg pr-2"></i>
      </button>

      <!-- 3) 두뇌 오목 -->
      <button onclick="openGame('omok')" class="w-full bg-gradient-to-r from-amber-800 to-amber-700 hover:from-amber-700 hover:to-amber-600 border-2 border-amber-500/60 p-4 sm:p-5 rounded-3xl shadow-xl flex items-center justify-between active:scale-95 transition text-left">
        <div class="flex items-center gap-4">
          <div class="w-13 h-13 text-3xl bg-black/40 rounded-2xl border border-amber-400/30 flex items-center justify-center shrink-0">
            ⚫⚪
          </div>
          <div>
            <h2 class="text-base sm:text-lg font-black text-white">두뇌 튼튼 오목 한판</h2>
            <p class="text-xs text-amber-200/80 mt-0.5">시원시원한 대형 바둑판 & AI 대전</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-amber-300 text-lg pr-2"></i>
      </button>
    </div>
  </section>

  <!-- ================= 2.  러브 하트 누르기 화면 ================= -->
  <section id="loveHeartScreen" class="w-full max-w-xl hidden flex-col justify-between h-full flex-1 gap-3 py-2">
    <!-- 상단 바 -->
    <div class="w-full flex items-center justify-between bg-slate-900/95 px-4 py-2.5 rounded-2xl border border-rose-800/60 shadow-md">

      <div class="text-center">

      </div>
      <div class="flex gap-2 text-right">
        <div class="bg-slate-950 border border-rose-900 px-3 py-1 rounded-xl">

          <span id="heartCountText" class="text-sm sm:text-base font-black text-rose-400">0 회</span>

      <div id="heartPlayground" class="relative bg-gradient-to-b from-rose-950/40 via-purple-950/30 to-slate-950 p-4 rounded-3xl sm:rounded-[36px] shadow-[inset_0_0_40px_rgba(244,63,94,0.3)] border-4 border-rose-900/60 w-full aspect-[4/5] max-w-lg flex flex-col items-center justify-center overflow-hidden cursor-pointer">
        
        <div class="absolute top-4 text-center pointer-events-none z-10 px-4">
          <p class="text-xs sm:text-sm font-black text-rose-300 drop-shadow">도망가는 하트를 재빠르게 터치해 보세요!</p>
          <p id="subHintText" class="text-[11px] text-slate-400 mt-0.5">점수가 높아질수록 하트가 더 쏜살같이 도망가요!</p>
        </div>

        <!-- 빠르게 움직이는 하트 버튼 -->
        <button id="floatingHeartBtn" onclick="onHeartClicked(event)" class="absolute z-20 text-6xl sm:text-7xl active:scale-75 select-none drop-shadow-[0_0_25px_rgba(244,63,94,0.95)] heart-float focus:outline-none transition-all duration-200">

    </div>

    <!-- 하단 획득 쿠폰 보관함 버튼 -->

      <button onclick="goHome()" class="text-sm font-bold text-slate-200 px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl active:scale-95 flex items-center gap-1.5 border border-slate-700 transition">

      <div class="text-center">
        <span class="text-base sm:text-lg font-black text-pink-400">보석 팡팡 💎</span>

        <div class="bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">

    <div class="my-auto p-1 flex items-center justify-center w-full">

        <div id="jewelGrid" class="w-full h-full grid grid-cols-6 gap-1.5 sm:gap-2"></div>
      </div>
    </div>

    <div class="pb-2 w-full">
      <button onclick="initJewelGame()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-black py-4 sm:py-5 rounded-2xl shadow-xl text-base active:scale-95 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-rotate"></i>
        <span>새 게임 시작하기</span>
      </button>
    </div>
  </section>

  <!-- ================= 4. 카드 뒤집기 화면 ================= -->
  <section id="cardScreen" class="w-full max-w-xl hidden flex-col justify-between h-full flex-1 gap-4 py-2">
    <div class="w-full flex items-center justify-between bg-slate-900/95 px-4 py-3 rounded-2xl border border-slate-800 shadow">
      <button onclick="goHome()" class="text-sm font-bold text-slate-200 px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl active:scale-95 flex items-center gap-1.5 border border-slate-700 transition">
        <i class="fa-solid fa-house"></i> 홈
      </button>
      <h2 class="text-base sm:text-lg font-black text-indigo-400">카드 뒤집기 🃏</h2>
      <div class="bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl text-right">
        <span class="text-[10px] text-slate-400 block font-bold">시도 횟수</span>
        <span id="cardMovesText" class="text-sm sm:text-base font-black text-amber-300">0</span>
      </div>
    </div>

    <div class="my-auto p-1 flex items-center justify-center w-full">
      <div class="bg-slate-900 p-4 sm:p-5 rounded-3xl shadow-2xl border-2 border-slate-800 w-full aspect-square max-w-lg flex items-center justify-center">
        <div id="cardGrid" class="w-full h-full grid grid-cols-4 gap-2.5 sm:gap-3.5"></div>
      </div>
    </div>

    <div class="pb-2 w-full">
      <button onclick="initCardGame()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 sm:py-5 rounded-2xl shadow-lg text-base active:scale-95 transition">
        🔄 새 게임 시작하기
      </button>
    </div>
  </section>

  <!-- ================= 5. 두뇌 오목 화면 ================= -->
  <section id="omokScreen" class="w-full max-w-xl hidden flex-col justify-between h-full flex-1 gap-4 py-2">
    <div class="w-full flex items-center justify-between bg-slate-900/95 px-4 py-3 rounded-2xl border border-slate-800 shadow">
      <button onclick="goHome()" class="text-sm font-bold text-slate-200 px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl active:scale-95 flex items-center gap-1.5 border border-slate-700 transition">
        <i class="fa-solid fa-house"></i> 홈
      </button>
      <div class="flex gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800">
        <button id="omok-diff-hard" onclick="setOmokDiff('hard')" class="text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-rose-600 text-white">어려움</button>
        <button id="omok-diff-normal" onclick="setOmokDiff('normal')" class="text-xs sm:text-sm px-3 py-1 rounded-lg font-bold text-slate-400">보통</button>
      </div>
      <div class="flex items-center gap-2">
        <div id="omok-turn-dot" class="w-4 h-4 rounded-full bg-black shadow border border-white/30"></div>
        <span id="omok-turn-text" class="text-sm font-black text-amber-300">내 차례</span>
      </div>
    </div>

    <div class="my-auto p-1 flex items-center justify-center w-full">
      <div class="bg-[#E4A054] p-2 sm:p-3 rounded-3xl shadow-2xl border-4 border-[#8B5A2B] w-full aspect-square max-w-lg flex items-center justify-center">
        <canvas id="omokCanvas" class="w-full h-full cursor-pointer rounded-2xl"></canvas>
      </div>
    </div>

    <div class="pb-2 flex gap-3 w-full">
      <button onclick="undoOmok()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-4 rounded-2xl border border-slate-700 text-sm sm:text-base active:scale-95 transition">
        ↩ 무르기
      </button>
      <button onclick="resetOmok()" class="flex-[2] bg-amber-600 hover:bg-amber-500 text-white font-black py-4 rounded-2xl shadow-lg text-sm sm:text-base active:scale-95 transition">
        🔄 새 판 시작
      </button>
    </div>
  </section>

  <!-- 당첨 쿠폰 모달 (선물 상자) -->
  <div id="couponModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
    <div class="bg-gradient-to-b from-slate-900 to-rose-950 border-2 border-pink-400 rounded-3xl p-6 sm:p-8 text-center max-w-xs sm:max-w-sm w-full shadow-[0_0_40px_rgba(244,63,94,0.5)]">
      <div id="couponEmoji" class="text-6xl mb-2 animate-bounce">🥰</div>
      <span class="text-xs font-black text-pink-300 uppercase tracking-widest bg-pink-900/60 px-3 py-1 rounded-full border border-pink-500/40">당첨을 축하해요!</span>
      <h3 id="couponTitle" class="text-xl sm:text-2xl font-black text-white mt-3 mb-2">따뜻한 포옹권</h3>
      <div class="p-3 bg-white/10 rounded-2xl border border-white/20 mb-5">
        <p id="couponDesc" class="text-xs sm:text-sm text-pink-100 font-bold leading-relaxed">
          "언제든 제시하면 10초 동안 따뜻하게 꽉 안아드립니다!"
        </p>
      </div>
      <button onclick="closeCouponModal()" class="w-full bg-gradient-to-r from-pink-500 to-rose-600 text-white font-black text-base py-3.5 rounded-xl active:scale-95 transition shadow-lg">
        쿠폰 보관함에 쏙 넣기 💌
      </button>
    </div>
  </div>

  <!-- 획득한 쿠폰 목록 모달 -->
  <div id="myRewardsModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border-2 border-amber-400 rounded-3xl p-6 text-center max-w-sm w-full shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="text-lg font-black text-amber-300">내 데이트 쿠폰함 🎁</h3>
        <button onclick="closeRewardsModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="rewardListContainer" class="flex-1 overflow-y-auto py-3 flex flex-col gap-2.5 text-left text-xs">
      </div>
      <button onclick="closeRewardsModal()" class="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl mt-2 active:scale-95 transition">
        닫기
      </button>
    </div>
  </div>

  <!-- 일반 게임 승리 알림 모달 -->
  <div id="gameModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border-2 border-amber-400 rounded-3xl p-6 sm:p-8 text-center max-w-xs sm:max-w-sm w-full shadow-2xl">
      <div id="modalEmoji" class="text-5xl sm:text-6xl mb-3">🏆</div>
      <h3 id="modalTitle" class="text-xl sm:text-2xl font-black text-white mb-2">승리!</h3>
      <p id="modalDesc" class="text-sm text-slate-300 font-bold mb-6">멋지게 해내셨습니다!</p>
      <button onclick="closeModal()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-base py-3.5 rounded-xl active:scale-95 transition">
        확인 👍
      </button>
    </div>
  </div>

  <script>
    // --- Web Audio 사운드 시스템 ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSfx(type) {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'heartPop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.08);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.09);
        } else if (type === 'couponJackpot') {
          [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(f, now + i * 0.07);
            g.gain.setValueAtTime(0.25, now + i * 0.07);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.07 + 0.2);
            o.connect(g); g.connect(ctx.destination);
            o.start(now + i * 0.07); o.stop(now + i * 0.07 + 0.21);
          });
          return;
        } else if (type === 'gemClick') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.06);
        } else if (type === 'gemPop') {
          [600, 800, 1000].forEach((f, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(f, now + i * 0.04);
            g.gain.setValueAtTime(0.25, now + i * 0.04);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.04 + 0.08);
            o.connect(g); g.connect(ctx.destination);
            o.start(now + i * 0.04); o.stop(now + i * 0.04 + 0.09);
          });
          return;
        } else if (type === 'cardFlip') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.07);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'winPoint') {
          [523, 659, 783, 1046].forEach((f, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.frequency.setValueAtTime(f, now + i * 0.06);
            g.gain.setValueAtTime(0.2, now + i * 0.06);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.06 + 0.12);
            o.connect(g); g.connect(ctx.destination);
            o.start(now + i * 0.06); o.stop(now + i * 0.06 + 0.13);
          });
          return;
        } else if (type === 'stone') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
          gain.gain.setValueAtTime(0.7, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.09);
        }
      } catch(e) {}
    }

    // --- 화면 네비게이션 ---
    function openGame(name) {
      getAudioCtx();
      stopHeartTimer();
      document.getElementById('lobbyScreen').classList.add('hidden');
      ['loveHeartScreen', 'jewelScreen', 'cardScreen', 'omokScreen'].forEach(id => {
        const el = document.getElementById(id);
        el.classList.add('hidden');
        el.classList.remove('flex');
      });

      if (name === 'loveHeart') {
        const el = document.getElementById('loveHeartScreen');
        el.classList.remove('hidden'); el.classList.add('flex');
        initLoveHeartGame();
      } else if (name === 'jewel') {
        const el = document.getElementById('jewelScreen');
        el.classList.remove('hidden'); el.classList.add('flex');
        initJewelGame();
      } else if (name === 'card') {
        const el = document.getElementById('cardScreen');
        el.classList.remove('hidden'); el.classList.add('flex');
        initCardGame();
      } else if (name === 'omok') {
        const el = document.getElementById('omokScreen');
        el.classList.remove('hidden'); el.classList.add('flex');
        setTimeout(resizeOmok, 50);
      }
    }

    function goHome() {
      stopHeartTimer();
      ['loveHeartScreen', 'jewelScreen', 'cardScreen', 'omokScreen'].forEach(id => {
        const el = document.getElementById(id);
        el.classList.add('hidden');
        el.classList.remove('flex');
      });
      document.getElementById('lobbyScreen').classList.remove('hidden');

    function openModal(emoji, title, desc) {
      document.getElementById('modalEmoji').textContent = emoji;

      document.getElementById('modalDesc').textContent = desc;
      document.getElementById('gameModal').classList.remove('hidden');

    function closeModal() {
      document.getElementById('gameModal').classList.add('hidden');
    }

    // ==============================================================
    // [0] 애인 전용 고속 러브 하트 누르기 엔진
    // ==============================================================
    let heartClicks = 0;
    let unlockedRewards = [];
    let heartMoveTimer = null;
    const heartEmojis = ['💖', '💕', '💗', '💓', '💝', '💘', '✨'];

    const REWARDS = [
      { target: 10, emoji: '🥰', title: '10초 꽉 안아주기권 (충전 포옹)', desc: '언제든 제시하면 따뜻하게 10초간 꽉 안아드립니다! 지친 하루 충전 완료 🥰' },
      { target: 25, emoji: '🍽️', title: '오늘의 메뉴 선택 & 저녁 데이트권', desc: '오늘 먹고 싶은 거 다 골라! 맛있는 저녁 함께 먹기 🍕🍣' },
      { target: 50, emoji: '💆', title: '피로 싹 풀리는 10분 어깨 안마권', desc: '오늘 하루도 수고했어! 정성 가득 10분 힐링 안마 서비스 💆' },
      { target: 77, emoji: '👑', title: '무조건 소원 1가지 들어주기권', desc: '언제든 사용 가능! 묻지도 따지지도 않고 소원 1개 들어줍니다 👑' }
    ];

    // 하트 속도 계산 (잡을수록 600ms -> 350ms까지 점점 더 빨라짐)
    function getHeartSpeed() {
      return Math.max(350, 600 - (heartClicks * 4));
    }

    function startHeartTimer() {
      stopHeartTimer();
      heartMoveTimer = setInterval(() => {
        moveHeartRandomly();
      }, getHeartSpeed());
    }

    function stopHeartTimer() {
      if (heartMoveTimer) {
        clearInterval(heartMoveTimer);
        heartMoveTimer = null;
      }
    }

    function initLoveHeartGame() {
      updateHeartUI();
      moveHeartRandomly();
      startHeartTimer();
    }

    function onHeartClicked(e) {
      playSfx('heartPop');
      heartClicks++;

      createParticles(e.clientX, e.clientY);

      const btn = document.getElementById('floatingHeartBtn');
      btn.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      
      // 누르자마자 즉시 순간 이동 후 새 속도로 타이머 재시작
      moveHeartRandomly();
      startHeartTimer();

      checkRewardMilestone();
      updateHeartUI();
    }

    function moveHeartRandomly() {
      const playground = document.getElementById('heartPlayground');
      const btn = document.getElementById('floatingHeartBtn');
      if (!playground || !btn) return;
      const rect = playground.getBoundingClientRect();

      const maxX = rect.width - 90;
      const maxY = rect.height - 110;
      const randX = Math.max(20, Math.floor(Math.random() * maxX));
      const randY = Math.max(70, Math.floor(Math.random() * maxY));

      btn.style.left = `${randX}px`;
      btn.style.top = `${randY}px`;
    }

    function createParticles(x, y) {
      const container = document.getElementById('particleContainer');
      const rect = container.getBoundingClientRect();
      const originX = x - rect.left;
      const originY = y - rect.top;

      for (let i = 0; i < 7; i++) {
        const span = document.createElement('span');
        span.className = 'particle absolute text-xl select-none';
        span.textContent = ['💖', '✨', '💕', '🌸'][Math.floor(Math.random() * 4)];
        span.style.left = `${originX}px`;
        span.style.top = `${originY}px`;

        const angle = Math.random() * Math.PI * 2;
        const dist = 40 + Math.random() * 50;
        span.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        span.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);

        container.appendChild(span);
        setTimeout(() => span.remove(), 700);
      }
    }

    function checkRewardMilestone() {
      for (let r of REWARDS) {
        if (heartClicks === r.target && !unlockedRewards.some(item => item.target === r.target)) {
          unlockedRewards.push(r);
          stopHeartTimer(); // 모달 뜰 때는 잠시 멈춤
          setTimeout(() => {
            triggerCouponModal(r);
          }, 200);
          break;
        }
      }
    }

    function triggerCouponModal(reward) {
      playSfx('couponJackpot');
      document.getElementById('couponEmoji').textContent = reward.emoji;
      document.getElementById('couponTitle').textContent = reward.title;
      document.getElementById('couponDesc').textContent = `"${reward.desc}"`;
      document.getElementById('couponModal').classList.remove('hidden');
    }

    function closeCouponModal() {
      document.getElementById('couponModal').classList.add('hidden');
      startHeartTimer(); // 모달 닫으면 다시 빠르게 달리기 시작
    }

    function updateHeartUI() {
      document.getElementById('heartCountText').textContent = `${heartClicks} 회`;
      document.getElementById('rewardBadgeCount').textContent = unlockedRewards.length;

      const next = REWARDS.find(r => r.target > heartClicks);
      if (next) {
        document.getElementById('nextRewardText').textContent = `${next.target}회 (${next.title.split(' ')[0]})`;
      } else {
        document.getElementById('nextRewardText').textContent = '모든 쿠폰 올클리어! 👑';
      }
    }

    function showMyRewards() {
      stopHeartTimer();
      const list = document.getElementById('rewardListContainer');
      list.innerHTML = '';

      if (unlockedRewards.length === 0) {
        list.innerHTML = `
          <div class="text-center py-8 text-slate-400">
            <span class="text-3xl block mb-2">🎁</span>
            아직 당첨된 쿠폰이 없어요!<br>하트를 10번 눌러서 첫 포옹 쿠폰을 받아보세요!
          </div>
        `;
      } else {
        unlockedRewards.forEach(r => {
          const item = document.createElement('div');
          item.className = 'bg-slate-800 border border-pink-500/40 p-3 rounded-2xl flex items-center gap-3 shadow';
          item.innerHTML = `
            <span class="text-3xl bg-pink-950/70 p-2 rounded-xl border border-pink-400/30">${r.emoji}</span>
            <div class="flex-1">
              <span class="text-[10px] text-pink-300 font-bold block">${r.target}회 달성 보상</span>
              <h4 class="text-sm font-black text-white">${r.title}</h4>
              <p class="text-[11px] text-slate-300 mt-0.5">${r.desc}</p>
            </div>
          `;
          list.appendChild(item);
        });
      }

      document.getElementById('myRewardsModal').classList.remove('hidden');
    }

    function closeRewardsModal() {
      document.getElementById('myRewardsModal').classList.add('hidden');
      startHeartTimer();
    }

    function resetHeartGame() {
      if (confirm('하트 누른 횟수와 쿠폰을 초기화할까요?')) {
        heartClicks = 0;
        unlockedRewards = [];
        updateHeartUI();
        moveHeartRandomly();
        startHeartTimer();
      }
    }

    // ==============================================================
    // [1] 보석 팡팡 매치 3
    // ==============================================================
    const J_ROWS = 6;
    const J_COLS = 6;
    const GEMS = ['💎', '🍒', '🍊', '🍇', '⭐', '🍀'];
    let jewelGrid = [];
    let selectedGem = null;
    let jewelScore = 0;
    let jewelMoves = 20;
    let isProcessing = false;

    function initJewelGame() {
      jewelScore = 0;
      jewelMoves = 20;
      selectedGem = null;
      isProcessing = false;
      document.getElementById('jewelScoreText').textContent = jewelScore;
      document.getElementById('jewelMovesText').textContent = jewelMoves;

      do {
        jewelGrid = [];
        for (let r = 0; r < J_ROWS; r++) {
          jewelGrid[r] = [];
          for (let c = 0; c < J_COLS; c++) {
            jewelGrid[r][c] = GEMS[Math.floor(Math.random() * GEMS.length)];
          }
        }
      } while (findMatches().length > 0);

      renderJewelGrid();
    }

    function renderJewelGrid() {
      const container = document.getElementById('jewelGrid');
      container.innerHTML = '';
      for (let r = 0; r < J_ROWS; r++) {
        for (let c = 0; c < J_COLS; c++) {
          const btn = document.createElement('button');
          const isSelected = selectedGem && selectedGem.r === r && selectedGem.c === c;
          btn.className = `gem-cell w-full h-full rounded-2xl flex items-center justify-center text-3xl sm:text-4xl shadow-md border ${isSelected ? 'bg-pink-600/60 border-yellow-300 scale-105 ring-4 ring-yellow-400' : 'bg-slate-800/80 border-slate-700/60 hover:bg-slate-700/80'} active:scale-95`;
          btn.textContent = jewelGrid[r][c];
          btn.onclick = () => onGemClick(r, c);
          container.appendChild(btn);
        }
      }
    }

    function onGemClick(r, c) {
      if (isProcessing || jewelMoves <= 0) return;
      playSfx('gemClick');

      if (!selectedGem) {
        selectedGem = { r, c };
        renderJewelGrid();
      } else {
        const dr = Math.abs(selectedGem.r - r);
        const dc = Math.abs(selectedGem.c - c);

        if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
          swapGems(selectedGem.r, selectedGem.c, r, c);
          const matches = findMatches();

          if (matches.length > 0) {
            jewelMoves--;
            document.getElementById('jewelMovesText').textContent = jewelMoves;
            selectedGem = null;
            processMatches();
          } else {
            swapGems(selectedGem.r, selectedGem.c, r, c);
            selectedGem = null;
            renderJewelGrid();
          }
        } else {
          selectedGem = { r, c };
          renderJewelGrid();
        }
      }
    }

    function swapGems(r1, c1, r2, c2) {
      const temp = jewelGrid[r1][c1];
      jewelGrid[r1][c1] = jewelGrid[r2][c2];
      jewelGrid[r2][c2] = temp;
    }

    function findMatches() {
      const matched = new Set();
      for (let r = 0; r < J_ROWS; r++) {
        for (let c = 0; c < J_COLS - 2; c++) {
          const gem = jewelGrid[r][c];
          if (gem && gem === jewelGrid[r][c+1] && gem === jewelGrid[r][c+2]) {
            matched.add(`${r},${c}`);
            matched.add(`${r},${c+1}`);
            matched.add(`${r},${c+2}`);
          }
        }
      }
      for (let c = 0; c < J_COLS; c++) {
        for (let r = 0; r < J_ROWS - 2; r++) {
          const gem = jewelGrid[r][c];
          if (gem && gem === jewelGrid[r+1][c] && gem === jewelGrid[r+2][c]) {
            matched.add(`${r},${c}`);
            matched.add(`${r+1},${c}`);
            matched.add(`${r+2},${c}`);
          }
        }
      }
      return Array.from(matched).map(s => {
        const [r, c] = s.split(',').map(Number);
        return { r, c };
      });
    }

    function processMatches() {
      isProcessing = true;
      const matches = findMatches();

      if (matches.length === 0) {
        isProcessing = false;
        renderJewelGrid();
        if (jewelMoves <= 0) {
          openModal('💎', '게임 종료!', `최종 점수: ${jewelScore}점! 멋지게 완료하셨습니다!`);
        }
        return;
      }

      playSfx('gemPop');
      jewelScore += matches.length * 20;
      document.getElementById('jewelScoreText').textContent = jewelScore;

      matches.forEach(m => {
        jewelGrid[m.r][m.c] = null;
      });
      renderJewelGrid();

      setTimeout(() => {
        for (let c = 0; c < J_COLS; c++) {
          let emptyRow = J_ROWS - 1;
          for (let r = J_ROWS - 1; r >= 0; r--) {
            if (jewelGrid[r][c] !== null) {
              jewelGrid[emptyRow][c] = jewelGrid[r][c];
              if (emptyRow !== r) jewelGrid[r][c] = null;
              emptyRow--;
            }
          }
          for (let r = emptyRow; r >= 0; r--) {
            jewelGrid[r][c] = GEMS[Math.floor(Math.random() * GEMS.length)];
          }
        }
        renderJewelGrid();
        setTimeout(processMatches, 300);
      }, 250);
    }

    // ==============================================================
    // [2] 카드 뒤집기
    // ==============================================================
    const cardIcons = ['🍎', '🍌', '🍓', '🍇', '🍉', '🍍', '🍒', '🥝'];
    let cardDeck = [];
    let flippedCards = [];
    let cardMoves = 0;
    let cardMatchedCount = 0;
    let cardLock = false;

    function initCardGame() {
      const items = [...cardIcons, ...cardIcons];
      items.sort(() => Math.random() - 0.5);
      cardDeck = items.map((icon, idx) => ({
        id: idx,
        icon: icon,
        matched: false
      }));
      flippedCards = [];
      cardMoves = 0;
      cardMatchedCount = 0;
      cardLock = false;
      document.getElementById('cardMovesText').textContent = cardMoves;

      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';
      cardDeck.forEach((c, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'w-full h-full card-flip cursor-pointer';
        wrap.innerHTML = `
          <div id="card-inner-${idx}" class="card-inner w-full h-full relative rounded-2xl shadow-md border border-slate-700">
            <div class="card-front absolute inset-0 bg-gradient-to-br from-indigo-700 to-indigo-900 rounded-2xl flex items-center justify-center text-white text-2xl sm:text-3xl font-black border border-indigo-400/40">
              ❓
            </div>
            <div class="card-back absolute inset-0 bg-slate-800 rounded-2xl flex items-center justify-center text-3xl sm:text-4xl border-2 border-amber-400">
              ${c.icon}
            </div>
          </div>
        `;
        wrap.onclick = () => flipCard(idx);
        grid.appendChild(wrap);
      });
    }

    function flipCard(idx) {
      if (cardLock) return;
      const card = cardDeck[idx];
      if (card.matched || flippedCards.includes(idx)) return;

      playSfx('cardFlip');
      document.getElementById(`card-inner-${idx}`).classList.add('flipped');
      flippedCards.push(idx);

      if (flippedCards.length === 2) {
        cardMoves++;
        document.getElementById('cardMovesText').textContent = cardMoves;
        const [firstIdx, secondIdx] = flippedCards;
        const c1 = cardDeck[firstIdx];
        const c2 = cardDeck[secondIdx];

        if (c1.icon === c2.icon) {
          playSfx('winPoint');
          c1.matched = true;
          c2.matched = true;
          cardMatchedCount += 2;
          flippedCards = [];

          if (cardMatchedCount === 16) {
            setTimeout(() => {
              openModal('🃏', '기억력 카드 완벽 클리어!', `${cardMoves}번 만에 모든 카드의 짝을 다 찾으셨어요!`);
            }, 400);
          }
        } else {
          cardLock = true;
          setTimeout(() => {
            document.getElementById(`card-inner-${firstIdx}`).classList.remove('flipped');
            document.getElementById(`card-inner-${secondIdx}`).classList.remove('flipped');
            flippedCards = [];
            cardLock = false;
          }, 800);
        }
      }
    }

    // ==============================================================
    // [3] 시원한 대형 오목
    // ==============================================================
    const omokCanvas = document.getElementById('omokCanvas');
    const omokCtx = omokCanvas.getContext('2d');
    const OMOK_SIZE = 11;
    let omokBoard = Array.from({ length: OMOK_SIZE }, () => Array(OMOK_SIZE).fill(0));
    let omokPlayer = 1;
    let omokHistory = [];
    let omokOver = false;

    function resizeOmok() {
      const rect = omokCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      omokCanvas.width = rect.width * dpr;
      omokCanvas.height = rect.height * dpr;
      omokCtx.scale(dpr, dpr);
      drawOmok();
    }

    function getOmokCellSize() {
      return omokCanvas.getBoundingClientRect().width / (OMOK_SIZE + 0.3);
    }
    function getOmokOffset() {
      return getOmokCellSize() * 0.65;
    }

    function drawOmok() {
      const rect = omokCanvas.getBoundingClientRect();
      const cellSize = getOmokCellSize();
      const offset = getOmokOffset();
      omokCtx.clearRect(0, 0, rect.width, rect.height);

      omokCtx.strokeStyle = '#4A2A10';
      omokCtx.lineWidth = 1.8;

      for (let i = 0; i < OMOK_SIZE; i++) {
        const pos = offset + cellSize * i;
        omokCtx.beginPath();
        omokCtx.moveTo(offset, pos);
        omokCtx.lineTo(offset + cellSize * (OMOK_SIZE - 1), pos);
        omokCtx.stroke();
        omokCtx.beginPath();
        omokCtx.moveTo(pos, offset);
        omokCtx.lineTo(pos, offset + cellSize * (OMOK_SIZE - 1));
        omokCtx.stroke();
      }

      const center = offset + cellSize * 5;
      omokCtx.fillStyle = '#4A2A10';
      omokCtx.beginPath();
      omokCtx.arc(center, center, 5, 0, Math.PI * 2);
      omokCtx.fill();

      for (let r = 0; r < OMOK_SIZE; r++) {
        for (let c = 0; c < OMOK_SIZE; c++) {
          if (omokBoard[r][c] !== 0) drawOmokStone(r, c, omokBoard[r][c]);
        }
      }

      if (omokHistory.length > 0) {
        const last = omokHistory[omokHistory.length - 1];
        omokCtx.fillStyle = '#EF4444';
        omokCtx.beginPath();
        omokCtx.arc(offset + cellSize * last.c, offset + cellSize * last.r, cellSize * 0.16, 0, Math.PI * 2);
        omokCtx.fill();
      }
    }

    function drawOmokStone(r, c, p) {
      const cellSize = getOmokCellSize();
      const offset = getOmokOffset();
      const x = offset + cellSize * c;
      const y = offset + cellSize * r;
      const radius = cellSize * 0.44;

      omokCtx.save();
      omokCtx.beginPath();
      omokCtx.arc(x, y, radius, 0, Math.PI * 2);
      omokCtx.shadowColor = 'rgba(0,0,0,0.4)';
      omokCtx.shadowBlur = 4;
      omokCtx.shadowOffsetX = 2;
      omokCtx.shadowOffsetY = 2;

      const grad = omokCtx.createRadialGradient(x - radius/3, y - radius/3, radius/10, x, y, radius);
      if (p === 1) {
        grad.addColorStop(0, '#555'); grad.addColorStop(1, '#111');
      } else {
        grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#ddd');
      }
      omokCtx.fillStyle = grad;
      omokCtx.fill();
      omokCtx.restore();
    }

    omokCanvas.addEventListener('click', (e) => {
      if (omokOver || omokPlayer === 2) return;
      const rect = omokCanvas.getBoundingClientRect();
      const cellSize = getOmokCellSize();
      const offset = getOmokOffset();
      const col = Math.round((e.clientX - rect.left - offset) / cellSize);
      const row = Math.round((e.clientY - rect.top - offset) / cellSize);

      if (row >= 0 && row < OMOK_SIZE && col >= 0 && col < OMOK_SIZE && omokBoard[row][col] === 0) {
        placeOmok(row, col, 1);
      }
    });

    function placeOmok(r, c, p) {
      omokBoard[r][c] = p;
      omokHistory.push({ r, c, p });
      drawOmok();
      playSfx('stone');

      if (checkOmokWin(r, c, p)) {
        omokOver = true;
        if (p === 1) openModal('🏆', '오목 승리!', '축하합니다! 인공지능을 멋지게 이기셨어요!');
        else openModal('🤖', '컴퓨터 승리!', '아쉽네요! 한 번 더 도전해보세요!');
        return;
      }

      omokPlayer = (p === 1) ? 2 : 1;
      updateOmokUI();

      if (omokPlayer === 2 && !omokOver) {
        setTimeout(omokAiMove, 250);
      }
    }

    function checkOmokWin(r, c, p) {
      const dirs = [[1,0], [0,1], [1,1], [1,-1]];
      for (let [dr, dc] of dirs) {
        let count = 1;
        for (let s = 1; s <= 4; s++) {
          let nr = r + dr*s, nc = c + dc*s;
          if (nr>=0 && nr<OMOK_SIZE && nc>=0 && nc<OMOK_SIZE && omokBoard[nr][nc] === p) count++; else break;
        }
        for (let s = 1; s <= 4; s++) {
          let nr = r - dr*s, nc = c - dc*s;
          if (nr>=0 && nr<OMOK_SIZE && nc>=0 && nc<OMOK_SIZE && omokBoard[nr][nc] === p) count++; else break;
        }
        if (count >= 5) return true;
      }
      return false;
    }

    function omokAiMove() {
      for (let target of [2, 1]) {
        for (let r = 0; r < OMOK_SIZE; r++) {
          for (let c = 0; c < OMOK_SIZE; c++) {
            if (omokBoard[r][c] === 0) {
              omokBoard[r][c] = target;
              if (checkOmokWin(r, c, target)) {
                omokBoard[r][c] = 0;
                placeOmok(r, c, 2);
                return;
              }
              omokBoard[r][c] = 0;
            }
          }
        }
      }
      let bestMove = null;
      let maxScore = -9999;
      for (let r = 0; r < OMOK_SIZE; r++) {
        for (let c = 0; c < OMOK_SIZE; c++) {
          if (omokBoard[r][c] === 0) {
            let centerBonus = (5 - Math.abs(r - 5)) + (5 - Math.abs(c - 5));
            let score = centerBonus + Math.random() * 20;
            if (score > maxScore) { maxScore = score; bestMove = { r, c }; }
          }
        }
      }
      if (bestMove) placeOmok(bestMove.r, bestMove.c, 2);
    }

    function updateOmokUI() {
      const dot = document.getElementById('omok-turn-dot');
      const text = document.getElementById('omok-turn-text');
      if (omokPlayer === 1) {
        dot.className = 'w-4 h-4 rounded-full bg-black shadow border border-white/20';
        text.textContent = '내 차례';
      } else {
        dot.className = 'w-4 h-4 rounded-full bg-white shadow';
        text.textContent = '생각 중...';
      }
    }

    function undoOmok() {
      if (omokHistory.length === 0 || omokOver) return;
      playSfx('stone');
      const steps = omokHistory.length >= 2 ? 2 : 1;
      for (let i = 0; i < steps; i++) {
        const last = omokHistory.pop();
        if (last) omokBoard[last.r][last.c] = 0;
      }
      omokPlayer = 1;
      updateOmokUI();
      drawOmok();
    }

    function resetOmok() {
      omokBoard = Array.from({ length: OMOK_SIZE }, () => Array(OMOK_SIZE).fill(0));
      omokHistory = [];
      omokPlayer = 1;
      omokOver = false;
      updateOmokUI();
      drawOmok();
    }

    function setOmokDiff(d) {
      document.getElementById('omok-diff-hard').className = d === 'hard' ? 'text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-rose-600 text-white' : 'text-xs sm:text-sm px-3 py-1 rounded-lg font-bold text-slate-400';
      document.getElementById('omok-diff-normal').className = d === 'normal' ? 'text-xs sm:text-sm px-3 py-1 rounded-lg font-bold bg-amber-600 text-white' : 'text-xs sm:text-sm px-3 py-1 rounded-lg font-bold text-slate-400';
      resetOmok();
    }

    window.addEventListener('resize', resizeOmok);
  </script>
</body>
