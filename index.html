<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘 밤 꿀잠 플레이어 🌙</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-5 select-none pb-8">

  <!-- 헤더 영역 -->
  <header class="w-full max-w-sm text-center pt-4">
    <div class="inline-block bg-indigo-900/60 text-indigo-300 text-xs font-bold px-3 py-1 rounded-full mb-2 border border-indigo-700/50">
      ✨ 터치 즉시 유튜브 1위 영상 재생
    </div>
    <h1 class="text-2xl font-black text-indigo-100">잠 솔솔 다이렉트 플레이 🌙</h1>
    <p class="text-slate-400 text-xs mt-1">버튼을 누르면 유튜브 영상이 즉시 바로 열려요</p>
  </header>

  <!-- 5가지 수면 테마 리스트 -->
  <main class="w-full max-w-sm my-6 flex flex-col gap-3">

    <!-- 1. 잔잔한 수면 음악 -->
    <div onclick="playDirectVideo('music')" class="flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition cursor-pointer active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-2xl">🎵</div>
        <div>
          <h2 class="text-base font-bold text-white">잔잔한 수면 음악</h2>
          <p class="text-xs text-slate-400">마음을 편안하게 녹이는 힐링 피아노</p>
        </div>
      </div>
      <i class="fa-solid fa-play text-indigo-400 text-base"></i>
    </div>

    <!-- 2. 조곤조곤 수면 이야기 -->
    <div onclick="playDirectVideo('story')" class="flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition cursor-pointer active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-2xl">📖</div>
        <div>
          <h2 class="text-base font-bold text-white">조곤조곤 수면 이야기</h2>
          <p class="text-xs text-slate-400">포근한 목소리로 읽어주는 옛날이야기</p>
        </div>
      </div>
      <i class="fa-solid fa-play text-amber-400 text-base"></i>
    </div>

    <!-- 3. 포근한 창가 빗소리 -->
    <div onclick="playDirectVideo('rain')" class="flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition cursor-pointer active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-2xl">🌧️</div>
        <div>
          <h2 class="text-base font-bold text-white">포근한 창가 밤빗소리</h2>
          <p class="text-xs text-slate-400">잡생각을 씻어주는 자연 백색소음</p>
        </div>
      </div>
      <i class="fa-solid fa-play text-blue-400 text-base"></i>
    </div>

    <!-- 4. 따뜻한 장작 모닥불 -->
    <div onclick="playDirectVideo('fire')" class="flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition cursor-pointer active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-orange-500/20 text-orange-400 flex items-center justify-center text-2xl">🔥</div>
        <div>
          <h2 class="text-base font-bold text-white">따뜻한 모닥불 장작소리</h2>
          <p class="text-xs text-slate-400">타닥타닥 마음을 감싸주는 모닥불</p>
        </div>
      </div>
      <i class="fa-solid fa-play text-orange-400 text-base"></i>
    </div>

    <!-- 5. 온몸 이완 수면 명상 -->
    <div onclick="playDirectVideo('meditation')" class="flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition cursor-pointer active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-2xl">🧘</div>
        <div>
          <h2 class="text-base font-bold text-white">온몸 이완 수면 명상</h2>
          <p class="text-xs text-slate-400">긴장을 스르륵 풀어주는 바디스캔</p>
        </div>
      </div>
      <i class="fa-solid fa-play text-purple-400 text-base"></i>
    </div>

  </main>

  <!-- 하단 메시지 -->
  <footer class="w-full max-w-sm pb-4 text-center text-xs text-slate-500">
    <p>터치하면 유튜브 앱으로 직행해서 영상이 바로 켜져요 💤</p>
  </footer>

  <script>
    // 카테고리별 가장 인기 있고 검증된 1등 대표 수면 영상들
    const videoPool = {
      // 1. 잔잔한 수면 피아노/델타파
      music: [
        '1ZYbU8csArI', // 깊은 수면 유도 델타파 음악
        'sjkrrmBnpK8', // 편안한 수면 힐링 피아노
        'FjHGZj2IjBk'  // 밤에 듣는 잔잔한 자장가
      ],
      // 2. 수면 이야기 오디오북
      story: [
        'Dk2bX4c8g_M', // 조곤조곤 전래동화 이야기
        'r2LpTky92qI', // 편안하게 잠드는 옛날이야기
        'k0eN3s9nNqM'  // 잠 솔솔 오는 라디오 오디오북
      ],
      // 3. 밤 빗소리 백색소음
      rain: [
        'mPZkdNFkNps', // 창가에 내리는 밤빗소리 3시간
        'uGQPK-closU', // 지붕을 두드리는 포근한 빗소리
        'lE6RYpe9IT0'  // 깊은 잠을 부르는 천둥 빗소리
      ],
      // 4. 모닥불 장작 타는 소리
      fire: [
        'L_LUpnjgPso', // 타닥타닥 타오르는 따뜻한 벽난로
        '478TejxW9zM', // 숲속 캠핑 모닥불 소리
        'eyU3bRy2x44'  // 포근한 장작 타는 소리 백색소음
      ],
      // 5. 전신 이완 수면 명상
      meditation: [
        'aEqlQvczMJQ', // 10분 온몸 긴장 풀기 수면 가이드
        '2OEL4P1Rz04', // 편안한 호흡과 바디스캔 명상
        'inpok4MKVLM'  // 불안과 잡념을 내려놓는 밤 명상
      ]
    };

    function playDirectVideo(category) {
      const list = videoPool[category];
      // 매번 누를 때마다 리스트 중 하나를 랜덤으로 골라 직행!
      const randomVideoId = list[Math.floor(Math.random() * list.length)];
      
      // 유튜브 앱(또는 웹) 영상 페이지로 다이렉트 연결
      const directUrl = 'https://www.youtube.com/watch?v=' + randomVideoId;
      window.location.href = directUrl;
    }
  </script>
</body>
</html>
