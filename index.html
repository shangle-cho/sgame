<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘 밤 꿀잠 플레이어 🌙</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 select-none pb-8">

  <!-- 헤더 영역 -->
  <header class="w-full max-w-sm text-center pt-3 mb-2">
    <div class="inline-block bg-indigo-900/60 text-indigo-300 text-xs font-bold px-3 py-1 rounded-full mb-1 border border-indigo-700/50">
      ✨ 터치 즉시 자동 재생
    </div>
    <h1 class="text-2xl font-black text-indigo-100">잠 솔솔 힐링 플레이어 🌙</h1>
    <p class="text-slate-400 text-xs mt-1">버튼을 터치하면 영상과 소리가 바로 시작돼요</p>
  </header>

  <!-- 유튜브 공식 플레이어 영역 (터치 시 화면 상단에 뜸) -->
  <div id="player-wrapper" class="w-full max-w-sm mb-4 hidden">
    <div class="relative w-full aspect-video rounded-2xl overflow-hidden shadow-2xl border-2 border-indigo-500/40 bg-black">
      <div id="youtube-player" class="w-full h-full"></div>
    </div>
    <div class="flex items-center justify-between mt-2 px-1">
      <span id="playing-title" class="text-xs font-bold text-indigo-300 truncate max-w-[200px]">재생 중...</span>
      <button onclick="playRandomAgain()" class="text-xs bg-indigo-900/80 hover:bg-indigo-800 text-indigo-200 px-2.5 py-1 rounded-lg border border-indigo-700/50 active:scale-95">
        🔀 다른 영상 랜덤
      </button>
    </div>
  </div>

  <!-- 5가지 수면 테마 리스트 -->
  <main class="w-full max-w-sm flex flex-col gap-2.5 my-auto">

    <!-- 1. 잔잔한 수면 음악 -->
    <div onclick="startVideo('music')" class="flex items-center justify-between p-3.5 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition cursor-pointer active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xl">🎵</div>
        <div>
          <h2 class="text-sm font-bold text-white">잔잔한 수면 음악</h2>
          <p class="text-xs text-slate-400">마음을 편안하게 녹이는 힐링 피아노</p>
        </div>
      </div>
      <i class="fa-solid fa-play text-indigo-400 text-sm"></i>
    </div>

    <!-- 2. 조곤조곤 수면 이야기 -->
    <div onclick="startVideo('story')" class="flex items-center justify-between p-3.5 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition cursor-pointer active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-xl">📖</div>
        <div>
          <h2 class="text-sm font-bold text-white">조곤조곤 수면 이야기</h2>
          <p class="text-xs text-slate-400">포근한 목소리로 읽어주는 옛날이야기</p>
        </div>
      </div>
      <i class="fa-solid fa-play text-amber-400 text-sm"></i>
    </div>

    <!-- 3. 포근한 창가 빗소리 -->
    <div onclick="startVideo('rain')" class="flex items-center justify-between p-3.5 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition cursor-pointer active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-xl">🌧️</div>
        <div>
          <h2 class="text-sm font-bold text-white">포근한 창가 밤빗소리</h2>
          <p class="text-xs text-slate-400">잡생각을 씻어주는 자연 백색소음</p>
        </div>
      </div>
      <i class="fa-solid fa-play text-blue-400 text-sm"></i>
    </div>

    <!-- 4. 따뜻한 장작 모닥불 -->
    <div onclick="startVideo('fire')" class="flex items-center justify-between p-3.5 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition cursor-pointer active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-orange-500/20 text-orange-400 flex items-center justify-center text-xl">🔥</div>
        <div>
          <h2 class="text-sm font-bold text-white">따뜻한 모닥불 장작소리</h2>
          <p class="text-xs text-slate-400">타닥타닥 마음을 감싸주는 모닥불</p>
        </div>
      </div>
      <i class="fa-solid fa-play text-orange-400 text-sm"></i>
    </div>

    <!-- 5. 온몸 이완 수면 명상 -->
    <div onclick="startVideo('meditation')" class="flex items-center justify-between p-3.5 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition cursor-pointer active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-xl">🧘</div>
        <div>
          <h2 class="text-sm font-bold text-white">온몸 이완 수면 명상</h2>
          <p class="text-xs text-slate-400">긴장을 스르륵 풀어주는 바디스캔</p>
        </div>
      </div>
      <i class="fa-solid fa-play text-purple-400 text-sm"></i>
    </div>

  </main>

  <!-- 하단 메시지 -->
  <footer class="w-full max-w-sm pb-2 text-center text-xs text-slate-500">
    <p>화면 밝기를 낮추고 편안하게 눈을 감아보세요 💤</p>
  </footer>

  <!-- 유튜브 공식 IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // 외부 재생이 완벽히 허용된 검증된 대표 영상 목록
    const videoData = {
      music: [
        { id: '1ZYbU8csArI', title: '잔잔한 피아노 수면 음악' },
        { id: 'sjkrrmBnpK8', title: '깊은 수면 델타파 멜로디' },
        { id: '77ZozI0rw7w', title: '포근한 오르골 자장가' }
      ],
      story: [
        { id: 'Dk2bX4c8g_M', title: '잠 잘 오는 전래동화 이야기' },
        { id: 'r2LpTky92qI', title: '마음 편안한 밤 오디오북' },
        { id: 'FjHGZj2IjBk', title: '따뜻한 목소리의 수면 이야기' }
      ],
      rain: [
        { id: 'mPZkdNFkNps', title: '창가를 두드리는 밤빗소리' },
        { id: 'uGQPK-closU', title: '지붕 위 포근한 빗소리' },
        { id: 'lE6RYpe9IT0', title: '깊은 잠을 부르는 자연 빗소리' }
      ],
      fire: [
        { id: 'L_LUpnjgPso', title: '타닥타닥 따뜻한 벽난로 장작' },
        { id: '478TejxW9zM', title: '숲속 캠핑 모닥불 백색소음' }
      ],
      meditation: [
        { id: 'aEqlQvczMJQ', title: '10분 온몸 긴장 풀기 수면 가이드' },
        { id: '2OEL4P1Rz04', title: '전신 이완 바디스캔 명상' },
        { id: 'inpok4MKVLM', title: '생각을 비우는 호흡 명상' }
      ]
    };

    let player = null;
    let isApiReady = false;
    let activeCategory = 'music';

    function onYouTubeIframeAPIReady() {
      isApiReady = true;
    }

    function startVideo(category) {
      activeCategory = category;
      const list = videoData[category];
      const selected = list[Math.floor(Math.random() * list.length)];

      const wrapper = document.getElementById('player-wrapper');
      const titleEl = document.getElementById('playing-title');
      
      wrapper.classList.remove('hidden');
      titleEl.textContent = '▶ ' + selected.title;

      if (!player) {
        // 플레이어 최초 생성 및 강제 자동재생
        player = new YT.Player('youtube-player', {
          videoId: selected.id,
          playerVars: {
            'autoplay': 1,
            'playsinline': 1,
            'rel': 0
          },
          events: {
            'onReady': function(event) {
              event.target.playVideo();
            }
          }
        });
      } else {
        // 이미 생성된 경우 새 영상 로드 및 즉시 자동재생
        player.loadVideoById(selected.id);
        player.playVideo();
      }

      // 플레이어 위치로 화면 부드럽게 올리기
      wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function playRandomAgain() {
      if (activeCategory) {
        startVideo(activeCategory);
      }
    }
  </script>
</body>
</html>
