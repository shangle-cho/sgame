<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘 밤 꿀잠 가이드 🌙</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #0F172A; /* 밤하늘 딥블루 */
      color: #F8FAFC;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-5 select-none">

  <!-- 헤더 영역 -->
  <header class="w-full max-w-sm text-center pt-4">
    <div class="inline-block bg-indigo-900/60 text-indigo-300 text-xs font-bold px-3 py-1 rounded-full mb-2 border border-indigo-700/50">
      ✨ 편안한 밤, 깊은 휴식
    </div>
    <h1 class="text-2xl font-black text-indigo-100">잠 못 드는 밤 꿀잠 처방</h1>
    <p class="text-gray-400 text-sm mt-1">마음이 편해지는 소리를 골라보세요 🌙</p>
  </header>

  <!-- 5가지 숙면 카드 리스트 -->
  <main class="w-full max-w-sm my-6 flex flex-col gap-3">

    <!-- 1. 수면 음악 -->
    <a href="https://www.youtube.com/results?search_query=수면음악+조회수+많은+순&sp=CAM%253D" target="_blank"
       class="flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-2xl">
          🎵
        </div>
        <div>
          <h2 class="text-base font-bold text-white">잔잔한 수면 음악</h2>
          <p class="text-xs text-slate-400">마음을 차분하게 해주는 델타파 피아노</p>
        </div>
      </div>
      <i class="fa-solid fa-chevron-right text-slate-500 text-sm"></i>
    </a>

    <!-- 2. 수면 이야기 -->
    <a href="https://www.youtube.com/results?search_query=수면이야기+조회수+많은+순&sp=CAM%253D" target="_blank"
       class="flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-2xl">
          📖
        </div>
        <div>
          <h2 class="text-base font-bold text-white">조곤조곤 수면 이야기</h2>
          <p class="text-xs text-slate-400">따뜻한 목소리로 읽어주는 옛날이야기</p>
        </div>
      </div>
      <i class="fa-solid fa-chevron-right text-slate-500 text-sm"></i>
    </a>

    <!-- 3. 자연의 소리 -->
    <a href="https://www.youtube.com/results?search_query=수면+빗소리+자연의소리+조회수+높은순&sp=CAM%253D" target="_blank"
       class="flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl">
          🌧️
        </div>
        <div>
          <h2 class="text-base font-bold text-white">자연의 백색소음</h2>
          <p class="text-xs text-slate-400">포근한 빗소리와 타닥타닥 모닥불</p>
        </div>
      </div>
      <i class="fa-solid fa-chevron-right text-slate-500 text-sm"></i>
    </a>

    <!-- 4. 수면 가이드 명상 -->
    <a href="https://www.youtube.com/results?search_query=수면명상+바디스캔+조회수+높은순&sp=CAM%253D" target="_blank"
       class="flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-2xl">
          🧘
        </div>
        <div>
          <h2 class="text-base font-bold text-white">온몸 이완 수면 명상</h2>
          <p class="text-xs text-slate-400">긴장을 스르륵 풀어주는 바디스캔</p>
        </div>
      </div>
      <i class="fa-solid fa-chevron-right text-slate-500 text-sm"></i>
    </a>

    <!-- 5. 팅글 ASMR -->
    <a href="https://www.youtube.com/results?search_query=수면유도+ASMR+노토킹+속삭임+조회수+높은순&sp=CAM%253D" target="_blank"
       class="flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-2xl">
          🎧
        </div>
        <div>
          <h2 class="text-base font-bold text-white">나긋나긋 힐링 ASMR</h2>
          <p class="text-xs text-slate-400">잡념을 싹 지워주는 귀가 편안한 소리</p>
        </div>
      </div>
      <i class="fa-solid fa-chevron-right text-slate-500 text-sm"></i>
    </a>

  </main>

  <!-- 하단 메시지 -->
  <footer class="w-full max-w-sm pb-6 text-center text-xs text-slate-500">
    <p>화면 불빛을 낮추고, 편안한 자세로 눈을 감아보세요 💤</p>
  </footer>

</body>
</html>
