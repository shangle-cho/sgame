<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>국민 두뇌 힐링 게임 삼총사 🎴⚫🃏</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
    }
    .card-flip {
      perspective: 1000px;
    }
    .card-inner {
      transition: transform 0.4s;
      transform-style: preserve-3d;
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      backface-visibility: hidden;
    }
    .card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-3 select-none">

  <!-- ================= 1. 메인 첫 화면 (로비) ================= -->
  <section id="lobbyScreen" class="w-full max-w-sm my-auto flex flex-col items-center py-4">
    <div class="inline-block bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs font-bold px-3.5 py-1 rounded-full mb-3 shadow">
      ✨ 남녀노소 즐기는 두뇌 활력 3종
    </div>
    <h1 class="text-3xl font-black text-amber-100 mb-1 tracking-tight">민속 게임 라운지 🎴</h1>
    <p class="text-xs text-slate-400 mb-6">원하는 게임을 콕 눌러보세요!</p>

    <div class="w-full flex flex-col gap-3.5">
      <!-- 1) 화투 짝맞추기 -->
      <button onclick="openGame('hwatu')" class="w-full bg-gradient-to-r from-red-800 to-rose-700 hover:from-red-700 hover:to-rose-600 border-2 border-red-500/60 p-4 rounded-3xl shadow-xl flex items-center justify-between active:scale-95 transition text-left">
        <div class="flex items-center gap-3.5">
          <span class="text-3xl bg-black/40 p-2.5 rounded-2xl border border-red-400/30">🎴</span>
          <div>
            <h2 class="text-base font-black text-white">원조 손맛! 화투 짝맞추기</h2>
            <p class="text-[11px] text-red-200/80">같은 화투 패를 찾아 짝 맞추기!</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-red-300 text-base pr-1"></i>
      </button>

      <!-- 2) 기억력 카드 뒤집기 -->
      <button onclick="openGame('card')" class="w-full bg-gradient-to-r from-indigo-800 to-purple-700 hover:from-indigo-700 hover:to-purple-600 border-2 border-indigo-400/60 p-4 rounded-3xl shadow-xl flex items-center justify-between active:scale-95 transition text-left">
        <div class="flex items-center gap-3.5">
          <span class="text-3xl bg-black/40 p-2.5 rounded-2xl border border-indigo-400/30">🃏</span>
          <div>
            <h2 class="text-base font-black text-white">기억력 쑥쑥! 카드 뒤집기</h2>
            <p class="text-[11px] text-indigo-200/80">숨겨진 카드를 열어 짝을 맞춰봐요</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-indigo-300 text-base pr-1"></i>
      </button>

      <!-- 3) 두뇌 오목 -->
      <button onclick="openGame('omok')" class="w-full bg-gradient-to-r from-amber-800 to-amber-700 hover:from-amber-700 hover:to-amber-600 border-2 border-amber-500/60 p-4 rounded-3xl shadow-xl flex items-center justify-between active:scale-95 transition text-left">
        <div class="flex items-center gap-3.5">
          <span class="text-3xl bg-black/40 p-2.5 rounded-2xl border border-amber-400/30">⚫⚪</span>
          <div>
            <h2 class="text-base font-black text-white">두뇌 튼튼 오목 한판</h2>
            <p class="text-[11px] text-amber-200/80">시원시원한 대형 바둑판 & AI 대전</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-amber-300 text-base pr-1"></i>
      </button>
    </div>
  </section>

  <!-- ================= 2. 화투 짝맞추기 화면 ================= -->
  <section id="hwatuScreen" class="w-full max-w-sm hidden flex-col justify-between h-full flex-1">
    <div class="flex items-center justify-between bg-slate-800/90 px-3 py-2 rounded-2xl border border-slate-700">
      <button onclick="goHome()" class="text-xs font-bold text-slate-300 px-2.5 py-1 bg-slate-700 rounded-xl active:scale-95 flex items-center gap-1">
        <i class="fa-solid fa-house"></i> 홈
      </button>
      <h2 class="text-base font-black text-red-400">화투 짝맞추기 🎴</h2>
      <div class="bg-slate-900 border border-slate-700 px-3 py-1 rounded-xl text-right">
        <span class="text-[9px] text-slate-400 block font-bold">남은 패</span>
        <span id="hwatuRemainText" class="text-sm font-black text-rose-300">16</span>
      </div>
    </div>

    <!-- 화투판 (녹색 담요 느낌) -->
    <div class="my-auto p-1 flex items-center justify-center">
      <div class="bg-[#1b4332] p-2.5 rounded-3xl shadow-2xl border-4 border-[#081c15] w-full aspect-[4/5] flex items-center justify-center">
        <div id="hwatuGrid" class="w-full h-full grid grid-cols-4 gap-2"></div>
      </div>
    </div>

    <div class="pb-2">
      <button onclick="initHwatu()" class="w-full bg-red-600 hover:bg-red-500 text-white font-black py-3.5 rounded-2xl shadow text-xs active:scale-95">
        🔄 화투 패 다시 섞기
      </button>
    </div>
  </section>

  <!-- ================= 3. 카드 뒤집기 화면 ================= -->
  <section id="cardScreen" class="w-full max-w-sm hidden flex-col justify-between h-full flex-1">
    <div class="flex items-center justify-between bg-slate-800/90 px-3 py-2 rounded-2xl border border-slate-700">
      <button onclick="goHome()" class="text-xs font-bold text-slate-300 px-2.5 py-1 bg-slate-700 rounded-xl active:scale-95 flex items-center gap-1">
        <i class="fa-solid fa-house"></i> 홈
      </button>
      <h2 class="text-base font-black text-indigo-400">카드 뒤집기 🃏</h2>
      <div class="bg-slate-900 border border-slate-700 px-3 py-1 rounded-xl text-right">
        <span class="text-[9px] text-slate-400 block font-bold">시도 횟수</span>
        <span id="cardMovesText" class="text-sm font-black text-amber-300">0</span>
      </div>
    </div>

    <div class="my-auto p-1 flex items-center justify-center">
      <div class="bg-slate-800/90 p-2.5 rounded-3xl shadow-2xl border-2 border-slate-700 w-full aspect-square flex items-center justify-center">
        <div id="cardGrid" class="w-full h-full grid grid-cols-4 gap-2"></div>
      </div>
    </div>

    <div class="pb-2">
      <button onclick="initCardGame()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3.5 rounded-2xl shadow text-xs active:scale-95">
        🔄 새 게임 시작하기
      </button>
    </div>
  </section>

  <!-- ================= 4. 두뇌 오목 화면 ================= -->
  <section id="omokScreen" class="w-full max-w-sm hidden flex-col justify-between h-full flex-1">
    <div class="flex items-center justify-between bg-slate-800/90 px-3 py-2 rounded-2xl border border-slate-700">
      <button onclick="goHome()" class="text-xs font-bold text-slate-300 px-2.5 py-1 bg-slate-700 rounded-xl active:scale-95 flex items-center gap-1">
        <i class="fa-solid fa-house"></i> 홈
      </button>
      <div class="flex gap-1 bg-slate-900 p-0.5 rounded-xl">
        <button id="omok-diff-hard" onclick="setOmokDiff('hard')" class="text-[11px] px-2 py-0.5 rounded-lg font-bold bg-rose-600 text-white">어려움</button>
        <button id="omok-diff-normal" onclick="setOmokDiff('normal')" class="text-[11px] px-2 py-0.5 rounded-lg font-bold text-slate-400">보통</button>
      </div>
      <div class="flex items-center gap-1.5">
        <div id="omok-turn-dot" class="w-3.5 h-3.5 rounded-full bg-black shadow border border-white/30"></div>
        <span id="omok-turn-text" class="text-xs font-black text-amber-300">내 차례</span>
      </div>
    </div>

    <!-- 대형 바둑판 -->
    <div class="my-auto p-1 flex items-center justify-center">
      <div class="bg-[#E4A054] p-1.5 rounded-2xl shadow-2xl border-4 border-[#8B5A2B] w-full aspect-square flex items-center justify-center">
        <canvas id="omokCanvas" class="w-full h-full cursor-pointer rounded-xl"></canvas>
      </div>
    </div>

    <div class="pb-2 flex gap-2">
      <button onclick="undoOmok()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3.5 rounded-2xl border border-slate-700 text-xs active:scale-95">
        ↩ 무르기
      </button>
      <button onclick="resetOmok()" class="flex-[2] bg-amber-600 hover:bg-amber-500 text-white font-black py-3.5 rounded-2xl shadow text-xs active:scale-95">
        🔄 새 판 시작
      </button>
    </div>
  </section>

  <!-- 결과 축하 모달 -->
  <div id="gameModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border-2 border-amber-400 rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl">
      <div id="modalEmoji" class="text-5xl mb-2">🏆</div>
      <h3 id="modalTitle" class="text-xl font-black text-white mb-1">성공!</h3>
      <p id="modalDesc" class="text-xs text-slate-300 font-bold mb-5">멋지게 해내셨습니다!</p>
      <button onclick="closeModal()" class="w-full bg-amber-500 text-slate-950 font-black text-sm py-3 rounded-xl active:scale-95">
        확인 👍
      </button>
    </div>
  </div>

  <script>
    // --- 공통 효과음 시스템 ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSfx(type) {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'hwatuHit') {
          // 착! 화투 패 내려치는 찰진 소리
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(70, now + 0.08);
          gain.gain.setValueAtTime(0.9, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        } else if (type === 'cardFlip') {
          // 카드 뒤집기
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(540, now + 0.06);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
        } else if (type === 'match') {
          // 짝 맞았을 때 딩동
          [523, 659, 783].forEach((f, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.frequency.setValueAtTime(f, now + i * 0.06);
            g.gain.setValueAtTime(0.2, now + i * 0.06);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.06 + 0.12);
            o.connect(g); g.connect(ctx.destination);
            o.start(now + i * 0.06); o.stop(now + i * 0.06 + 0.13);
          });
          return;
        } else if (type === 'stone') {
          // 바둑돌 탁 소리
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
          gain.gain.setValueAtTime(0.7, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        }
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      } catch(e) {}
    }

    // --- 화면 전환 네비게이션 ---
    function openGame(name) {
      getAudioCtx();
      document.getElementById('lobbyScreen').classList.add('hidden');
      ['hwatuScreen', 'cardScreen', 'omokScreen'].forEach(id => {
        const el = document.getElementById(id);
        el.classList.add('hidden');
        el.classList.remove('flex');
      });

      if (name === 'hwatu') {
        const el = document.getElementById('hwatuScreen');
        el.classList.remove('hidden'); el.classList.add('flex');
        initHwatu();
      } else if (name === 'card') {
        const el = document.getElementById('cardScreen');
        el.classList.remove('hidden'); el.classList.add('flex');
        initCardGame();
      } else if (name === 'omok') {
        const el = document.getElementById('omokScreen');
        el.classList.remove('hidden'); el.classList.add('flex');
        setTimeout(resizeOmok, 50);
      }
    }

    function goHome() {
      ['hwatuScreen', 'cardScreen', 'omokScreen'].forEach(id => {
        const el = document.getElementById(id);
        el.classList.add('hidden');
        el.classList.remove('flex');
      });
      document.getElementById('lobbyScreen').classList.remove('hidden');
    }

    function openModal(emoji, title, desc) {
      document.getElementById('modalEmoji').textContent = emoji;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = desc;
      document.getElementById('gameModal').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('gameModal').classList.add('hidden');
    }

    // ==============================================================
    // [1] 화투 짝맞추기 게임 로직
    // ==============================================================
    const hwatuCardsData = [
      { id: 1, name: '1월 송학', symbol: '🦅', color: 'border-red-600 bg-red-950/80 text-rose-200' },
      { id: 2, name: '2월 매화', symbol: '🌸', color: 'border-pink-600 bg-pink-950/80 text-pink-200' },
      { id: 3, name: '3월 벚꽃', symbol: '🌺', color: 'border-rose-500 bg-rose-950/80 text-rose-100' },
      { id: 4, name: '4월 흑싸리', symbol: '🌿', color: 'border-emerald-600 bg-emerald-950/80 text-emerald-200' },
      { id: 5, name: '5월 난초', symbol: '🎋', color: 'border-teal-600 bg-teal-950/80 text-teal-200' },
      { id: 6, name: '6월 모란', symbol: '💮', color: 'border-amber-600 bg-amber-950/80 text-amber-200' },
      { id: 7, name: '7월 홍싸리', symbol: '🐗', color: 'border-red-500 bg-red-900/80 text-red-200' },
      { id: 8, name: '8월 공산', symbol: '🌕', color: 'border-yellow-400 bg-yellow-950/80 text-yellow-200' }
    ];

    let hwatuDeck = [];
    let hwatuSelected = null;
    let hwatuRemain = 16;
    let hwatuLock = false;

    function initHwatu() {
      // 8종류 x 2장 = 16장
      hwatuDeck = [...hwatuCardsData, ...hwatuCardsData].map((item, idx) => ({
        ...item,
        uniqueId: idx,
        matched: false
      }));
      // 셔플
      hwatuDeck.sort(() => Math.random() - 0.5);
      hwatuSelected = null;
      hwatuRemain = 16;
      hwatuLock = false;
      document.getElementById('hwatuRemainText').textContent = hwatuRemain;
      renderHwatu();
    }

    function renderHwatu() {
      const grid = document.getElementById('hwatuGrid');
      grid.innerHTML = '';
      hwatuDeck.forEach((card, index) => {
        const btn = document.createElement('button');
        if (card.matched) {
          btn.className = 'w-full h-full rounded-2xl opacity-0 pointer-events-none';
        } else {
          const isSel = hwatuSelected && hwatuSelected.uniqueId === card.uniqueId;
          btn.className = `w-full h-full rounded-2xl border-2 flex flex-col items-center justify-center p-1 shadow-lg transition active:scale-95 ${card.color} ${isSel ? 'ring-4 ring-yellow-400 scale-105' : ''}`;
          btn.innerHTML = `
            <span class="text-2xl sm:text-3xl">${card.symbol}</span>
            <span class="text-[10px] font-black mt-1 leading-tight text-center">${card.name}</span>
          `;
          btn.onclick = () => selectHwatuCard(index);
        }
        grid.appendChild(btn);
      });
    }

    function selectHwatuCard(index) {
      if (hwatuLock) return;
      const card = hwatuDeck[index];
      if (card.matched) return;

      playSfx('hwatuHit');

      if (!hwatuSelected) {
        hwatuSelected = card;
        renderHwatu();
      } else {
        if (hwatuSelected.uniqueId === card.uniqueId) {
          hwatuSelected = null;
          renderHwatu();
          return;
        }

        // 짝 검사
        if (hwatuSelected.id === card.id) {
          playSfx('match');
          hwatuDeck.find(c => c.uniqueId === hwatuSelected.uniqueId).matched = true;
          card.matched = true;
          hwatuRemain -= 2;
          document.getElementById('hwatuRemainText').textContent = hwatuRemain;
          hwatuSelected = null;
          renderHwatu();

          if (hwatuRemain === 0) {
            setTimeout(() => {
              openModal('🎴', '화투 짝맞추기 완성!', '모든 화투 패를 멋지게 다 맞추셨습니다! 손맛 최고!');
            }, 300);
          }
        } else {
          // 틀렸을 때 살짝 보여주고 취소
          hwatuLock = true;
          renderHwatu();
          setTimeout(() => {
            hwatuSelected = null;
            hwatuLock = false;
            renderHwatu();
          }, 450);
        }
      }
    }

    // ==============================================================
    // [2] 카드 뒤집기 (기억력 짝맞추기)
    // ==============================================================
    const cardIcons = ['🍎', '🍌', '🍓', '🍇', '🍉', '🍍', '🍒', '🥝'];
    let cardDeck = [];
    let flippedCards = [];
    let cardMoves = 0;
    let cardMatchedCount = 0;
    let cardLock = false;

    function initCardGame() {
      const items = [...cardIcons, ...cardIcons];
      items.sort(() => Math.random() - 0.5);
      cardDeck = items.map((icon, idx) => ({
        id: idx,
        icon: icon,
        matched: false
      }));
      flippedCards = [];
      cardMoves = 0;
      cardMatchedCount = 0;
      cardLock = false;
      document.getElementById('cardMovesText').textContent = cardMoves;

      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';
      cardDeck.forEach((c, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'w-full h-full card-flip cursor-pointer';
        wrap.innerHTML = `
          <div id="card-inner-${idx}" class="card-inner w-full h-full relative rounded-2xl shadow-md border border-slate-700">
            <div class="card-front absolute inset-0 bg-gradient-to-br from-indigo-700 to-indigo-900 rounded-2xl flex items-center justify-center text-white text-2xl font-black border border-indigo-400/40">
              ❓
            </div>
            <div class="card-back absolute inset-0 bg-slate-800 rounded-2xl flex items-center justify-center text-3xl border-2 border-amber-400">
              ${c.icon}
            </div>
          </div>
        `;
        wrap.onclick = () => flipCard(idx);
        grid.appendChild(wrap);
      });
    }

    function flipCard(idx) {
      if (cardLock) return;
      const card = cardDeck[idx];
      if (card.matched || flippedCards.includes(idx)) return;

      playSfx('cardFlip');
      document.getElementById(`card-inner-${idx}`).classList.add('flipped');
      flippedCards.push(idx);

      if (flippedCards.length === 2) {
        cardMoves++;
        document.getElementById('cardMovesText').textContent = cardMoves;
        const [firstIdx, secondIdx] = flippedCards;
        const c1 = cardDeck[firstIdx];
        const c2 = cardDeck[secondIdx];

        if (c1.icon === c2.icon) {
          playSfx('match');
          c1.matched = true;
          c2.matched = true;
          cardMatchedCount += 2;
          flippedCards = [];

          if (cardMatchedCount === 16) {
            setTimeout(() => {
              openModal('🃏', '기억력 카드 완벽 클리어!', `${cardMoves}번 만에 모든 카드의 짝을 다 찾으셨어요! 대단합니다!`);
            }, 400);
          }
        } else {
          cardLock = true;
          setTimeout(() => {
            document.getElementById(`card-inner-${firstIdx}`).classList.remove('flipped');
            document.getElementById(`card-inner-${secondIdx}`).classList.remove('flipped');
            flippedCards = [];
            cardLock = false;
          }, 800);
        }
      }
    }

    // ==============================================================
    // [3] 시원한 대형 오목
    // ==============================================================
    const omokCanvas = document.getElementById('omokCanvas');
    const omokCtx = omokCanvas.getContext('2d');
    const OMOK_SIZE = 11;
    let omokBoard = Array.from({ length: OMOK_SIZE }, () => Array(OMOK_SIZE).fill(0));
    let omokPlayer = 1;
    let omokHistory = [];
    let omokOver = false;

    function resizeOmok() {
      const rect = omokCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      omokCanvas.width = rect.width * dpr;
      omokCanvas.height = rect.height * dpr;
      omokCtx.scale(dpr, dpr);
      drawOmok();
    }

    function getOmokCellSize() {
      return omokCanvas.getBoundingClientRect().width / (OMOK_SIZE + 0.3);
    }
    function getOmokOffset() {
      return getOmokCellSize() * 0.65;
    }

    function drawOmok() {
      const rect = omokCanvas.getBoundingClientRect();
      const cellSize = getOmokCellSize();
      const offset = getOmokOffset();
      omokCtx.clearRect(0, 0, rect.width, rect.height);

      omokCtx.strokeStyle = '#4A2A10';
      omokCtx.lineWidth = 1.8;

      for (let i = 0; i < OMOK_SIZE; i++) {
        const pos = offset + cellSize * i;
        omokCtx.beginPath();
        omokCtx.moveTo(offset, pos);
        omokCtx.lineTo(offset + cellSize * (OMOK_SIZE - 1), pos);
        omokCtx.stroke();
        omokCtx.beginPath();
        omokCtx.moveTo(pos, offset);
        omokCtx.lineTo(pos, offset + cellSize * (OMOK_SIZE - 1));
        omokCtx.stroke();
      }

      const center = offset + cellSize * 5;
      omokCtx.fillStyle = '#4A2A10';
      omokCtx.beginPath();
      omokCtx.arc(center, center, 5, 0, Math.PI * 2);
      omokCtx.fill();

      for (let r = 0; r < OMOK_SIZE; r++) {
        for (let c = 0; c < OMOK_SIZE; c++) {
          if (omokBoard[r][c] !== 0) drawOmokStone(r, c, omokBoard[r][c]);
        }
      }

      if (omokHistory.length > 0) {
        const last = omokHistory[omokHistory.length - 1];
        omokCtx.fillStyle = '#EF4444';
        omokCtx.beginPath();
        omokCtx.arc(offset + cellSize * last.c, offset + cellSize * last.r, cellSize * 0.16, 0, Math.PI * 2);
        omokCtx.fill();
      }
    }

    function drawOmokStone(r, c, p) {
      const cellSize = getOmokCellSize();
      const offset = getOmokOffset();
      const x = offset + cellSize * c;
      const y = offset + cellSize * r;
      const radius = cellSize * 0.44;

      omokCtx.save();
      omokCtx.beginPath();
      omokCtx.arc(x, y, radius, 0, Math.PI * 2);
      omokCtx.shadowColor = 'rgba(0,0,0,0.4)';
      omokCtx.shadowBlur = 4;
      omokCtx.shadowOffsetX = 2;
      omokCtx.shadowOffsetY = 2;

      const grad = omokCtx.createRadialGradient(x - radius/3, y - radius/3, radius/10, x, y, radius);
      if (p === 1) {
        grad.addColorStop(0, '#555'); grad.addColorStop(1, '#111');
      } else {
        grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#ddd');
      }
      omokCtx.fillStyle = grad;
      omokCtx.fill();
      omokCtx.restore();
    }

    omokCanvas.addEventListener('click', (e) => {
      if (omokOver || omokPlayer === 2) return;
      const rect = omokCanvas.getBoundingClientRect();
      const cellSize = getOmokCellSize();
      const offset = getOmokOffset();
      const col = Math.round((e.clientX - rect.left - offset) / cellSize);
      const row = Math.round((e.clientY - rect.top - offset) / cellSize);

      if (row >= 0 && row < OMOK_SIZE && col >= 0 && col < OMOK_SIZE && omokBoard[row][col] === 0) {
        placeOmok(row, col, 1);
      }
    });

    function placeOmok(r, c, p) {
      omokBoard[r][c] = p;
      omokHistory.push({ r, c, p });
      drawOmok();
      playSfx('stone');

      if (checkOmokWin(r, c, p)) {
        omokOver = true;
        if (p === 1) openModal('🏆', '오목 승리!', '축하합니다! 인공지능을 멋지게 이기셨어요!');
        else openModal('🤖', '컴퓨터 승리!', '아쉽네요! 한 번 더 도전해보세요!');
        return;
      }

      omokPlayer = (p === 1) ? 2 : 1;
      updateOmokUI();

      if (omokPlayer === 2 && !omokOver) {
        setTimeout(omokAiMove, 250);
      }
    }

    function checkOmokWin(r, c, p) {
      const dirs = [[1,0], [0,1], [1,1], [1,-1]];
      for (let [dr, dc] of dirs) {
        let count = 1;
        for (let s = 1; s <= 4; s++) {
          let nr = r + dr*s, nc = c + dc*s;
          if (nr>=0 && nr<OMOK_SIZE && nc>=0 && nc<OMOK_SIZE && omokBoard[nr][nc] === p) count++; else break;
        }
        for (let s = 1; s <= 4; s++) {
          let nr = r - dr*s, nc = c - dc*s;
          if (nr>=0 && nr<OMOK_SIZE && nc>=0 && nc<OMOK_SIZE && omokBoard[nr][nc] === p) count++; else break;
        }
        if (count >= 5) return true;
      }
      return false;
    }

    function omokAiMove() {
      for (let target of [2, 1]) {
        for (let r = 0; r < OMOK_SIZE; r++) {
          for (let c = 0; c < OMOK_SIZE; c++) {
            if (omokBoard[r][c] === 0) {
              omokBoard[r][c] = target;
              if (checkOmokWin(r, c, target)) {
                omokBoard[r][c] = 0;
                placeOmok(r, c, 2);
                return;
              }
              omokBoard[r][c] = 0;
            }
          }
        }
      }
      let bestMove = null;
      let maxScore = -9999;
      for (let r = 0; r < OMOK_SIZE; r++) {
        for (let c = 0; c < OMOK_SIZE; c++) {
          if (omokBoard[r][c] === 0) {
            let centerBonus = (5 - Math.abs(r - 5)) + (5 - Math.abs(c - 5));
            let score = centerBonus + Math.random() * 20;
            if (score > maxScore) { maxScore = score; bestMove = { r, c }; }
          }
        }
      }
      if (bestMove) placeOmok(bestMove.r, bestMove.c, 2);
    }

    function updateOmokUI() {
      const dot = document.getElementById('omok-turn-dot');
      const text = document.getElementById('omok-turn-text');
      if (omokPlayer === 1) {
        dot.className = 'w-3.5 h-3.5 rounded-full bg-black shadow border border-white/20';
        text.textContent = '내 차례';
      } else {
        dot.className = 'w-3.5 h-3.5 rounded-full bg-white shadow';
        text.textContent = '생각 중...';
      }
    }

    function undoOmok() {
      if (omokHistory.length === 0 || omokOver) return;
      playSfx('hwatuHit');
      const steps = omokHistory.length >= 2 ? 2 : 1;
      for (let i = 0; i < steps; i++) {
        const last = omokHistory.pop();
        if (last) omokBoard[last.r][last.c] = 0;
      }
      omokPlayer = 1;
      updateOmokUI();
      drawOmok();
    }

    function resetOmok() {
      omokBoard = Array.from({ length: OMOK_SIZE }, () => Array(OMOK_SIZE).fill(0));
      omokHistory = [];
      omokPlayer = 1;
      omokOver = false;
      updateOmokUI();
      drawOmok();
    }

    function setOmokDiff(d) {
      document.getElementById('omok-diff-hard').className = d === 'hard' ? 'text-[11px] px-2 py-0.5 rounded-lg font-bold bg-rose-600 text-white' : 'text-[11px] px-2 py-0.5 rounded-lg font-bold text-slate-400';
      document.getElementById('omok-diff-normal').className = d === 'normal' ? 'text-[11px] px-2 py-0.5 rounded-lg font-bold bg-amber-600 text-white' : 'text-[11px] px-2 py-0.5 rounded-lg font-bold text-slate-400';
      resetOmok();
    }

    window.addEventListener('resize', resizeOmok);
  </script>
</body>
