    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
    }
    .card-flip {
      perspective: 1000px;
    }
    .card-inner {
      transition: transform 0.4s;
      transform-style: preserve-3d;
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      backface-visibility: hidden;
    }
    .card-back {
      transform: rotateY(180deg);
    }
    /* 정통 화투 패 입체 테두리 */
    .hwatu-card {
      aspect-ratio: 5 / 8;
      background: #c1121f;
      border: 3px solid #780000;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.5), inset 0 0 3px rgba(255,255,255,0.3);
      border-radius: 8px;
    }
    .hwatu-inner {
      background: #ffffff;
      border-radius: 4px;
      overflow: hidden;
      width: calc(100% - 6px);
      height: calc(100% - 6px);
    }
  </style>

  <script>
    // --- 공통 효과음 시스템 ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSfx(type) {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'hwatuHit') {
          // 착! 화투 패 내려치는 찰진 소리
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(70, now + 0.08);
          gain.gain.setValueAtTime(0.9, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        } else if (type === 'cardFlip') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(540, now + 0.06);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
        } else if (type === 'match') {
          [523, 659, 783].forEach((f, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.frequency.setValueAtTime(f, now + i * 0.06);
            g.gain.setValueAtTime(0.2, now + i * 0.06);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.06 + 0.12);
            o.connect(g); g.connect(ctx.destination);
            o.start(now + i * 0.06); o.stop(now + i * 0.06 + 0.13);
          });
          return;
        } else if (type === 'stone') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
          gain.gain.setValueAtTime(0.7, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        }
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      } catch(e) {}
    }

    // --- 화면 전환 네비게이션 ---
    function openGame(name) {
      getAudioCtx();
      document.getElementById('lobbyScreen').classList.add('hidden');
      ['hwatuScreen', 'cardScreen', 'omokScreen'].forEach(id => {
        const el = document.getElementById(id);
        el.classList.add('hidden');
        el.classList.remove('flex');
      });

      if (name === 'hwatu') {
        const el = document.getElementById('hwatuScreen');
        el.classList.remove('hidden'); el.classList.add('flex');
        initHwatu();
      } else if (name === 'card') {
        const el = document.getElementById('cardScreen');
        el.classList.remove('hidden'); el.classList.add('flex');
        initCardGame();
      } else if (name === 'omok') {
        const el = document.getElementById('omokScreen');
        el.classList.remove('hidden'); el.classList.add('flex');
        setTimeout(resizeOmok, 50);
      }
    }

    function goHome() {
      ['hwatuScreen', 'cardScreen', 'omokScreen'].forEach(id => {
        const el = document.getElementById(id);
        el.classList.add('hidden');
        el.classList.remove('flex');
      });
      document.getElementById('lobbyScreen').classList.remove('hidden');
    }

    function openModal(emoji, title, desc) {
      document.getElementById('modalEmoji').textContent = emoji;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = desc;
      document.getElementById('gameModal').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('gameModal').classList.add('hidden');
    }

        </svg>
      `,
      // 10월 단풍 사슴
      danpung: `
        <svg viewBox="0 0 100 160" class="w-full h-full">
          <rect width="100" height="160" fill="#fff" />
          <!-- 붉은 단풍잎들 -->
          <path d="M20 20 L30 10 L40 20 L30 30 Z" fill="#d90429" />
          <path d="M70 30 L80 15 L90 30 L80 40 Z" fill="#d90429" />
          <path d="M15 60 L25 50 L35 60 L25 70 Z" fill="#f77f00" />
          <path d="M60 70 L75 55 L85 70 L75 85 Z" fill="#d90429" />
          <!-- 서 있는 수사슴 -->
          <path d="M35 150 L40 105 L65 105 L70 150 L60 150 L58 120 L48 120 L45 150 Z" fill="#582f0e"/>
          <ellipse cx="65" cy="100" rx="10" ry="7" fill="#582f0e" />
          <path d="M68 95 L75 75 M72 85 L80 82 M70 95 L65 78 M67 85 L60 82" stroke="#111" stroke-width="2.5" />
          <rect x="75" y="10" width="16" height="50" fill="#1d3557" rx="2" />
          <text x="83" y="38" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle" writing-mode="vertical-rl">청단</text>
        </svg>
      `
    };

    const hwatuMasterData = [
      { id: 'songhak', name: '1월 송학(광)', svg: hwatuSVGs.songhak },
      { id: 'meong', name: '2월 매화(홍단)', svg: hwatuSVGs.meong },
      { id: 'sakura', name: '3월 벚꽃(광)', svg: hwatuSVGs.sakura },
      { id: 'heukssari', name: '4월 흑싸리', svg: hwatuSVGs.heukssari },
      { id: 'nancho', name: '5월 난초(초단)', svg: hwatuSVGs.nancho },
      { id: 'moran', name: '6월 모란(청단)', svg: hwatuSVGs.moran },
      { id: 'palwol', name: '8월 팔달(광)', svg: hwatuSVGs.palwol },
      { id: 'danpung', name: '10월 단풍(사슴)', svg: hwatuSVGs.danpung }
    ];

    let hwatuDeck = [];
    let hwatuSelected = null;
    let hwatuRemain = 16;
    let hwatuLock = false;

    function initHwatu() {
      // 8종류 x 2장 = 16장 덱
      hwatuDeck = [...hwatuMasterData, ...hwatuMasterData].map((item, idx) => ({
        ...item,
        uniqueId: idx,
        matched: false
      }));
      hwatuDeck.sort(() => Math.random() - 0.5);
      hwatuSelected = null;
      hwatuRemain = 16;
      hwatuLock = false;
      document.getElementById('hwatuRemainText').textContent = hwatuRemain;
      renderHwatu();
    }

    function renderHwatu() {
      const grid = document.getElementById('hwatuGrid');
      grid.innerHTML = '';
      hwatuDeck.forEach((card, index) => {
        const btn = document.createElement('div');
        if (card.matched) {
          btn.className = 'w-full hwatu-card opacity-0 pointer-events-none';
        } else {
          const isSel = hwatuSelected && hwatuSelected.uniqueId === card.uniqueId;
          btn.className = `w-full hwatu-card cursor-pointer flex flex-col items-center justify-center p-0.5 active:scale-95 transition-transform ${isSel ? 'ring-4 ring-yellow-300 scale-105' : ''}`;
          btn.innerHTML = `
            <div class="hwatu-inner flex flex-col items-center justify-between p-1">
              <div class="w-full flex-1 flex items-center justify-center overflow-hidden">
                ${card.svg}
              </div>
              <span class="text-[9px] font-black text-slate-800 tracking-tighter truncate w-full text-center mt-0.5">
                ${card.name}
              </span>
            </div>
          `;
          btn.onclick = () => selectHwatuCard(index);
        }
        grid.appendChild(btn);
      });
    }

    function selectHwatuCard(index) {
      if (hwatuLock) return;
      const card = hwatuDeck[index];
      if (card.matched) return;

      playSfx('hwatuHit');

      if (!hwatuSelected) {
        hwatuSelected = card;
        renderHwatu();
      } else {
        if (hwatuSelected.uniqueId === card.uniqueId) {
          hwatuSelected = null;
          renderHwatu();
          return;
        }

        // 짝이 일치할 때
        if (hwatuSelected.id === card.id) {
          playSfx('match');
          hwatuDeck.find(c => c.uniqueId === hwatuSelected.uniqueId).matched = true;
          card.matched = true;
          hwatuRemain -= 2;
          document.getElementById('hwatuRemainText').textContent = hwatuRemain;
          hwatuSelected = null;
          renderHwatu();

          if (hwatuRemain === 0) {
            setTimeout(() => {
              openModal('🎴', '화투 짝맞추기 완성!', '정통 화투 패를 모두 맞추셨습니다! 손맛 최고!');
            }, 300);
          }
        } else {
          // 불일치 시 잠시 표시 후 해제
          hwatuLock = true;
          renderHwatu();
          setTimeout(() => {
            hwatuSelected = null;
            hwatuLock = false;
            renderHwatu();
          }, 450);
        }
      }
    }

    // ==============================================================
    // [2] 카드 뒤집기
    // ==============================================================
    const cardIcons = ['🍎', '🍌', '🍓', '🍇', '🍉', '🍍', '🍒', '🥝'];
    let cardDeck = [];
    let flippedCards = [];
    let cardMoves = 0;
    let cardMatchedCount = 0;
    let cardLock = false;

    function initCardGame() {
      const items = [...cardIcons, ...cardIcons];
      items.sort(() => Math.random() - 0.5);
      cardDeck = items.map((icon, idx) => ({
        id: idx,
        icon: icon,
        matched: false
      }));
      flippedCards = [];
      cardMoves = 0;
      cardMatchedCount = 0;
      cardLock = false;
      document.getElementById('cardMovesText').textContent = cardMoves;

      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';
      cardDeck.forEach((c, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'w-full h-full card-flip cursor-pointer';
        wrap.innerHTML = `
          <div id="card-inner-${idx}" class="card-inner w-full h-full relative rounded-2xl shadow-md border border-slate-700">
            <div class="card-front absolute inset-0 bg-gradient-to-br from-indigo-700 to-indigo-900 rounded-2xl flex items-center justify-center text-white text-2xl font-black border border-indigo-400/40">
              ❓
            </div>
            <div class="card-back absolute inset-0 bg-slate-800 rounded-2xl flex items-center justify-center text-3xl border-2 border-amber-400">
              ${c.icon}
            </div>
          </div>
        `;
        wrap.onclick = () => flipCard(idx);
        grid.appendChild(wrap);
      });
    }

    function flipCard(idx) {
      if (cardLock) return;
      const card = cardDeck[idx];
      if (card.matched || flippedCards.includes(idx)) return;

      playSfx('cardFlip');
      document.getElementById(`card-inner-${idx}`).classList.add('flipped');
      flippedCards.push(idx);

      if (flippedCards.length === 2) {
        cardMoves++;
        document.getElementById('cardMovesText').textContent = cardMoves;
        const [firstIdx, secondIdx] = flippedCards;
        const c1 = cardDeck[firstIdx];
        const c2 = cardDeck[secondIdx];

        if (c1.icon === c2.icon) {
          playSfx('match');
          c1.matched = true;
          c2.matched = true;
          cardMatchedCount += 2;
          flippedCards = [];

          if (cardMatchedCount === 16) {
            setTimeout(() => {
              openModal('🃏', '기억력 카드 완벽 클리어!', `${cardMoves}번 만에 모든 카드의 짝을 다 찾으셨어요!`);
            }, 400);
          }
        } else {
          cardLock = true;
          setTimeout(() => {
            document.getElementById(`card-inner-${firstIdx}`).classList.remove('flipped');
            document.getElementById(`card-inner-${secondIdx}`).classList.remove('flipped');
            flippedCards = [];
            cardLock = false;
          }, 800);
        }
      }
    }

    // ==============================================================
    // [3] 시원한 대형 오목
    // ==============================================================
    const omokCanvas = document.getElementById('omokCanvas');
    const omokCtx = omokCanvas.getContext('2d');
    const OMOK_SIZE = 11;
    let omokBoard = Array.from({ length: OMOK_SIZE }, () => Array(OMOK_SIZE).fill(0));
    let omokPlayer = 1;
    let omokHistory = [];
    let omokOver = false;

    function resizeOmok() {
      const rect = omokCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      omokCanvas.width = rect.width * dpr;
      omokCanvas.height = rect.height * dpr;
      omokCtx.scale(dpr, dpr);
      drawOmok();
    }

    function getOmokCellSize() {
      return omokCanvas.getBoundingClientRect().width / (OMOK_SIZE + 0.3);
    }
    function getOmokOffset() {
      return getOmokCellSize() * 0.65;
    }

    function drawOmok() {
      const rect = omokCanvas.getBoundingClientRect();
      const cellSize = getOmokCellSize();
      const offset = getOmokOffset();
      omokCtx.clearRect(0, 0, rect.width, rect.height);

      omokCtx.strokeStyle = '#4A2A10';
      omokCtx.lineWidth = 1.8;

      for (let i = 0; i < OMOK_SIZE; i++) {
        const pos = offset + cellSize * i;
        omokCtx.beginPath();
        omokCtx.moveTo(offset, pos);
        omokCtx.lineTo(offset + cellSize * (OMOK_SIZE - 1), pos);
        omokCtx.stroke();
        omokCtx.beginPath();
        omokCtx.moveTo(pos, offset);
        omokCtx.lineTo(pos, offset + cellSize * (OMOK_SIZE - 1));
        omokCtx.stroke();
      }

      const center = offset + cellSize * 5;
      omokCtx.fillStyle = '#4A2A10';
      omokCtx.beginPath();
      omokCtx.arc(center, center, 5, 0, Math.PI * 2);
      omokCtx.fill();

      for (let r = 0; r < OMOK_SIZE; r++) {
        for (let c = 0; c < OMOK_SIZE; c++) {
          if (omokBoard[r][c] !== 0) drawOmokStone(r, c, omokBoard[r][c]);
        }
      }

      if (omokHistory.length > 0) {
        const last = omokHistory[omokHistory.length - 1];
        omokCtx.fillStyle = '#EF4444';
        omokCtx.beginPath();
        omokCtx.arc(offset + cellSize * last.c, offset + cellSize * last.r, cellSize * 0.16, 0, Math.PI * 2);
        omokCtx.fill();
      }
    }

    function drawOmokStone(r, c, p) {
      const cellSize = getOmokCellSize();
      const offset = getOmokOffset();
      const x = offset + cellSize * c;
      const y = offset + cellSize * r;
      const radius = cellSize * 0.44;

      omokCtx.save();
      omokCtx.beginPath();
      omokCtx.arc(x, y, radius, 0, Math.PI * 2);
      omokCtx.shadowColor = 'rgba(0,0,0,0.4)';
      omokCtx.shadowBlur = 4;
      omokCtx.shadowOffsetX = 2;
      omokCtx.shadowOffsetY = 2;

      const grad = omokCtx.createRadialGradient(x - radius/3, y - radius/3, radius/10, x, y, radius);
      if (p === 1) {
        grad.addColorStop(0, '#555'); grad.addColorStop(1, '#111');
      } else {
        grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#ddd');
      }
      omokCtx.fillStyle = grad;
      omokCtx.fill();
      omokCtx.restore();
    }

    omokCanvas.addEventListener('click', (e) => {
      if (omokOver || omokPlayer === 2) return;
      const rect = omokCanvas.getBoundingClientRect();
      const cellSize = getOmokCellSize();
      const offset = getOmokOffset();
      const col = Math.round((e.clientX - rect.left - offset) / cellSize);
      const row = Math.round((e.clientY - rect.top - offset) / cellSize);

      if (row >= 0 && row < OMOK_SIZE && col >= 0 && col < OMOK_SIZE && omokBoard[row][col] === 0) {
        placeOmok(row, col, 1);
      }
    });

    function placeOmok(r, c, p) {
      omokBoard[r][c] = p;
      omokHistory.push({ r, c, p });
      drawOmok();
      playSfx('stone');

      if (checkOmokWin(r, c, p)) {
        omokOver = true;
        if (p === 1) openModal('🏆', '오목 승리!', '축하합니다! 인공지능을 멋지게 이기셨어요!');
        else openModal('🤖', '컴퓨터 승리!', '아쉽네요! 한 번 더 도전해보세요!');
        return;
      }

      omokPlayer = (p === 1) ? 2 : 1;
      updateOmokUI();

      if (omokPlayer === 2 && !omokOver) {
        setTimeout(omokAiMove, 250);
      }
    }

    function checkOmokWin(r, c, p) {
      const dirs = [[1,0], [0,1], [1,1], [1,-1]];
      for (let [dr, dc] of dirs) {
        let count = 1;
        for (let s = 1; s <= 4; s++) {
          let nr = r + dr*s, nc = c + dc*s;
          if (nr>=0 && nr<OMOK_SIZE && nc>=0 && nc<OMOK_SIZE && omokBoard[nr][nc] === p) count++; else break;
        }
        for (let s = 1; s <= 4; s++) {
          let nr = r - dr*s, nc = c - dc*s;
          if (nr>=0 && nr<OMOK_SIZE && nc>=0 && nc<OMOK_SIZE && omokBoard[nr][nc] === p) count++; else break;
        }
        if (count >= 5) return true;
      }
      return false;
    }

    function omokAiMove() {
      for (let target of [2, 1]) {
        for (let r = 0; r < OMOK_SIZE; r++) {
          for (let c = 0; c < OMOK_SIZE; c++) {
            if (omokBoard[r][c] === 0) {
              omokBoard[r][c] = target;
              if (checkOmokWin(r, c, target)) {
                omokBoard[r][c] = 0;
                placeOmok(r, c, 2);
                return;
              }
              omokBoard[r][c] = 0;
            }
          }
        }
      }
      let bestMove = null;
      let maxScore = -9999;
      for (let r = 0; r < OMOK_SIZE; r++) {
        for (let c = 0; c < OMOK_SIZE; c++) {
          if (omokBoard[r][c] === 0) {
            let centerBonus = (5 - Math.abs(r - 5)) + (5 - Math.abs(c - 5));
            let score = centerBonus + Math.random() * 20;
            if (score > maxScore) { maxScore = score; bestMove = { r, c }; }
          }
        }
      }
      if (bestMove) placeOmok(bestMove.r, bestMove.c, 2);
    }

    function updateOmokUI() {
      const dot = document.getElementById('omok-turn-dot');
      const text = document.getElementById('omok-turn-text');
      if (omokPlayer === 1) {
        dot.className = 'w-3.5 h-3.5 rounded-full bg-black shadow border border-white/20';
        text.textContent = '내 차례';
      } else {
        dot.className = 'w-3.5 h-3.5 rounded-full bg-white shadow';
        text.textContent = '생각 중...';
      }
    }

    function undoOmok() {
      if (omokHistory.length === 0 || omokOver) return;
      playSfx('hwatuHit');
      const steps = omokHistory.length >= 2 ? 2 : 1;
      for (let i = 0; i < steps; i++) {
        const last = omokHistory.pop();
        if (last) omokBoard[last.r][last.c] = 0;
      }
      omokPlayer = 1;
      updateOmokUI();
      drawOmok();
    }

    function resetOmok() {
      omokBoard = Array.from({ length: OMOK_SIZE }, () => Array(OMOK_SIZE).fill(0));
      omokHistory = [];
      omokPlayer = 1;
      omokOver = false;
      updateOmokUI();
      drawOmok();
    }

    function setOmokDiff(d) {
      document.getElementById('omok-diff-hard').className = d === 'hard' ? 'text-[11px] px-2 py-0.5 rounded-lg font-bold bg-rose-600 text-white' : 'text-[11px] px-2 py-0.5 rounded-lg font-bold text-slate-400';
      document.getElementById('omok-diff-normal').className = d === 'normal' ? 'text-[11px] px-2 py-0.5 rounded-lg font-bold bg-amber-600 text-white' : 'text-[11px] px-2 py-0.5 rounded-lg font-bold text-slate-400';
      resetOmok();
    }

    window.addEventListener('resize', resizeOmok);
  </script>
</body>
