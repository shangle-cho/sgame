<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘 밤 꿀잠 플레이어 🌙</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 select-none pb-8">

  <!-- 헤더 영역 -->
  <header class="w-full max-w-sm text-center pt-3 mb-2">
    <div class="inline-block bg-indigo-900/60 text-indigo-300 text-xs font-bold px-3 py-1 rounded-full mb-1 border border-indigo-700/50">
      ✨ 터치 즉시 수면 사운드 재생
    </div>
    <h1 class="text-2xl font-black text-indigo-100">잠 솔솔 힐링 플레이어 🌙</h1>
    <p class="text-slate-400 text-xs mt-1">원하는 테마를 누르면 상단에서 바로 재생돼요</p>
  </header>

  <!-- 상단 비디오 플레이어 영역 -->
  <div id="player-wrapper" class="w-full max-w-sm mb-4 hidden">
    <div class="relative w-full aspect-video rounded-2xl overflow-hidden shadow-2xl border-2 border-indigo-500/40 bg-black">
      <iframe id="video-frame" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="flex items-center justify-between mt-2 px-1">
      <span id="playing-title" class="text-xs font-bold text-indigo-300 truncate max-w-[200px]">재생 준비 완료</span>
      <button onclick="playRandomCurrent()" class="text-xs bg-indigo-900/80 hover:bg-indigo-800 text-indigo-200 px-2.5 py-1 rounded-lg border border-indigo-700/50 active:scale-95">
        🔀 다른 영상 랜덤
      </button>
    </div>
  </div>

  <!-- 5가지 수면 테마 리스트 -->
  <main class="w-full max-w-sm flex flex-col gap-2.5 my-auto">

    <!-- 1. 잔잔한 수면 피아노 -->
    <div onclick="playSelected('music')" class="flex items-center justify-between p-3.5 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition cursor-pointer active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xl">🎵</div>
        <div>
          <h2 class="text-sm font-bold text-white">잔잔한 수면 피아노 음악</h2>
          <p class="text-xs text-slate-400">마음을 편안하게 녹여주는 힐링 피아노 연주</p>
        </div>
      </div>
      <i class="fa-solid fa-play text-indigo-400 text-sm"></i>
    </div>

    <!-- 2. 조곤조곤 수면 이야기 -->
    <div onclick="playSelected('story')" class="flex items-center justify-between p-3.5 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition cursor-pointer active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-xl">📖</div>
        <div>
          <h2 class="text-sm font-bold text-white">조곤조곤 옛날 이야기</h2>
          <p class="text-xs text-slate-400">마음 편안해지는 전래동화 & 낭독</p>
        </div>
      </div>
      <i class="fa-solid fa-play text-amber-400 text-sm"></i>
    </div>

    <!-- 3. 포근한 창가 빗소리 -->
    <div onclick="playSelected('rain')" class="flex items-center justify-between p-3.5 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition cursor-pointer active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-xl">🌧️</div>
        <div>
          <h2 class="text-sm font-bold text-white">포근한 처마 밑 빗소리</h2>
          <p class="text-xs text-slate-400">생각을 비워주는 차분한 밤 빗소리</p>
        </div>
      </div>
      <i class="fa-solid fa-play text-blue-400 text-sm"></i>
    </div>

    <!-- 4. 따뜻한 장작 모닥불 -->
    <div onclick="playSelected('fire')" class="flex items-center justify-between p-3.5 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition cursor-pointer active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-orange-500/20 text-orange-400 flex items-center justify-center text-xl">🔥</div>
        <div>
          <h2 class="text-sm font-bold text-white">따뜻한 장작 모닥불</h2>
          <p class="text-xs text-slate-400">타닥타닥 마음이 따뜻해지는 불멍 소리</p>
        </div>
      </div>
      <i class="fa-solid fa-play text-orange-400 text-sm"></i>
    </div>

    <!-- 5. 온몸 이완 수면 명상 -->
    <div onclick="playSelected('meditation')" class="flex items-center justify-between p-3.5 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 rounded-2xl shadow-lg transition cursor-pointer active:scale-98">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-xl">🧘</div>
        <div>
          <h2 class="text-sm font-bold text-white">온몸 이완 수면 명상</h2>
          <p class="text-xs text-slate-400">다정한 음성 안내로 편안한 전신 이완</p>
        </div>
      </div>
      <i class="fa-solid fa-play text-purple-400 text-sm"></i>
    </div>

  </main>

  <footer class="w-full max-w-sm pb-2 text-center text-xs text-slate-500">
    화면 밝기를 낮추고 편안하게 눈을 감아보세요 💤
  </footer>

  <script>
    // 퍼가기 재생 권한이 안정적인 영상 목록
    const videoData = {
      music: [
        { id: '1ZYbU8csArI', title: '잔잔한 수면 피아노' },
        { id: 'DWcJFNfaw9c', title: '밤에 듣기 좋은 피아노 멜로디' }
      ],
      story: [
        { id: 'Dk2bX4c8g_M', title: '포근한 목소리의 옛날이야기' },
        { id: 'FjHGZj2IjBk', title: '잠 솔솔 오는 전래동화' },
        { id: 'r2LpTky92qI', title: '차분한 밤 낭독 오디오북' }
      ],
      rain: [
        { id: 'mPZkdNFkNps', title: '포근한 처마 밑 빗소리' },
        { id: 'uGQPK-closU', title: '마음을 편안하게 해주는 빗소리' }
      ],
      fire: [
        { id: 'L_LUpnjgPso', title: '따뜻한 모닥불 장작소리' },
        { id: '478TejxW9zM', title: '포근한 캠핑 모닥불' }
      ],
      meditation: [
        { id: 'aEqlQvczMJQ', title: '10분 수면 유도 바디스캔 명상' },
        { id: 'inpok4MKVLM', title: '생각을 비워주는 호흡 명상' }
      ]
    };

    let activeCat = 'music';

    function playSelected(category) {
      activeCat = category;
      const list = videoData[category];
      const item = list[Math.floor(Math.random() * list.length)];

      const wrapper = document.getElementById('player-wrapper');
      const frame = document.getElementById('video-frame');
      const title = document.getElementById('playing-title');

      wrapper.classList.remove('hidden');
      title.textContent = '▶ ' + item.title;

      // 모바일 유튜브 표준 임베드 인라인 주입
      frame.src = 'https://www.youtube.com/embed/' + item.id + '?autoplay=1&playsinline=1&enablejsapi=1';

      wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function playRandomCurrent() {
      if (activeCat) {
        playSelected(activeCat);
      }
    }
  </script>
</body>
</html>
