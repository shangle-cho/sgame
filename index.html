<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>두뇌 튼튼 오목 한판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
    }
    .board-bg {
      background-color: #E4A054;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.25);
    }
    .grid-cell {
      position: relative;
    }
    /* 바둑판 격자선 */
    .grid-cell::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1.5px;
      background-color: #5C3A1E;
      transform: translateX(-50%);
    }
    .grid-cell::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1.5px;
      background-color: #5C3A1E;
      transform: translateY(-50%);
    }
    /* 모서리 및 테두리 격자선 정리 */
    .cell-top::before { top: 50%; }
    .cell-bottom::before { bottom: 50%; }
    .cell-left::after { left: 50%; }
    .cell-right::after { right: 50%; }

    /* 바둑돌 */
    .stone {
      position: absolute;
      width: 84%;
      height: 84%;
      border-radius: 50%;
      z-index: 10;
      box-shadow: 2px 3px 5px rgba(0, 0, 0, 0.4);
      transition: transform 0.1s ease;
    }
    .stone.black {
      background: radial-gradient(circle at 35% 35%, #555, #111 80%);
    }
    .stone.white {
      background: radial-gradient(circle at 35% 35%, #ffffff, #dcdcdc 80%);
      border: 1px solid #bbb;
    }
    .last-marker {
      width: 25%;
      height: 25%;
      background-color: #EF4444;
      border-radius: 50%;
      position: absolute;
      z-index: 20;
    }
  </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center justify-between p-3 select-none">

  <!-- 헤더 -->
  <header class="w-full max-w-sm text-center pt-1">
    <div class="inline-block bg-amber-200 text-amber-900 text-xs font-bold px-3 py-1 rounded-full mb-1">
      🧠 두뇌 활력 오목 게임
    </div>
    <h1 class="text-2xl font-black text-gray-900">두뇌 튼튼 오목 한판</h1>
    
    <!-- 모드 선택 및 차례 표시 -->
    <div class="mt-2 flex items-center justify-between bg-white px-3 py-2 rounded-xl shadow-sm border border-amber-200">
      <div class="flex gap-1">
        <button id="mode-ai" onclick="setMode('ai')" class="text-xs px-2.5 py-1 rounded-lg font-bold bg-amber-600 text-white">vs 컴퓨터</button>
        <button id="mode-p2p" onclick="setMode('p2p')" class="text-xs px-2.5 py-1 rounded-lg font-bold bg-gray-100 text-gray-700">2인 대결</button>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold text-gray-500">현재 차례:</span>
        <div id="turn-badge" class="flex items-center gap-1 bg-amber-100 px-2 py-0.5 rounded-full">
          <div id="turn-indicator" class="w-3.5 h-3.5 rounded-full bg-black"></div>
          <span id="turn-text" class="text-xs font-black text-gray-800">흑돌 차례</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 바둑판 본체 (11 x 11) -->
  <main class="w-full max-w-sm flex items-center justify-center my-auto">
    <div class="board-bg p-2 rounded-2xl shadow-xl w-full aspect-square border-4 border-[#8B5A2B]">
      <div id="board" class="w-full h-full grid grid-cols-11 grid-rows-11">
        <!-- 자바스크립트로 121개 셀 생성 -->
      </div>
    </div>
  </main>

  <!-- 하단 조작 버튼 -->
  <footer class="w-full max-w-sm pb-2 flex gap-2">
    <button onclick="undoMove()" class="flex-1 bg-white hover:bg-gray-50 text-gray-700 font-bold py-2.5 rounded-xl border border-gray-300 shadow-sm text-sm active:scale-95 transition">
      ↩ 무르기
    </button>
    <button onclick="restartGame()" class="flex-[2] bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-xl shadow-md text-sm active:scale-95 transition">
      🔄 새 판 시작하기
    </button>
  </footer>

  <!-- 승리 축하 모달 -->
  <div id="winner-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl border-4 border-amber-400">
      <div class="text-5xl mb-2">🏆</div>
      <h2 id="winner-title" class="text-2xl font-black text-gray-800 mb-1">흑돌 승리!</h2>
      <p id="winner-desc" class="text-gray-600 text-sm font-bold mb-5">축하드립니다! 다섯 알을 멋지게 이으셨어요!</p>
      <button onclick="restartGame()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-black text-base py-3 rounded-xl shadow-md transition">
        다시 한판 하기 🎯
      </button>
    </div>
  </div>

  <script>
    const SIZE = 11;
    let boardState = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    let currentPlayer = 1; // 1: 흑, 2: 백
    let gameMode = 'ai'; // 'ai' or 'p2p'
    let moveHistory = [];
    let isGameOver = false;

    const boardEl = document.getElementById('board');
    const turnIndicator = document.getElementById('turn-indicator');
    const turnText = document.getElementById('turn-text');
    const winnerModal = document.getElementById('winner-modal');
    const winnerTitle = document.getElementById('winner-title');
    const winnerDesc = document.getElementById('winner-desc');

    function initBoard() {
      boardEl.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const cell = document.createElement('div');
          cell.classList.add('grid-cell', 'flex', 'items-center', 'justify-center', 'cursor-pointer');
          if (r === 0) cell.classList.add('cell-top');
          if (r === SIZE - 1) cell.classList.add('cell-bottom');
          if (c === 0) cell.classList.add('cell-left');
          if (c === SIZE - 1) cell.classList.add('cell-right');
          
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.addEventListener('click', () => handleCellClick(r, c));
          boardEl.appendChild(cell);
        }
      }
    }

    function handleCellClick(r, c) {
      if (isGameOver || boardState[r][c] !== 0) return;

      placeStone(r, c, currentPlayer);

      if (checkWin(r, c, currentPlayer)) {
        endGame(currentPlayer);
        return;
      }

      // 턴 넘기기
      currentPlayer = currentPlayer === 1 ? 2 : 1;
      updateTurnUI();

      // 컴퓨터 AI 차례
      if (gameMode === 'ai' && currentPlayer === 2 && !isGameOver) {
        setTimeout(makeAIMove, 300);
      }
    }

    function placeStone(r, c, player) {
      boardState[r][c] = player;
      moveHistory.push({ r, c, player });

      const cell = boardEl.children[r * SIZE + c];
      const stone = document.createElement('div');
      stone.classList.add('stone', player === 1 ? 'black' : 'white');
      cell.appendChild(stone);
